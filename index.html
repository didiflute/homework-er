<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Eric学习">
<meta name="theme-color" content="#e0703a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Eric 的学习小站</title>
<style>
:root{
  --bg:#fbf7f1;--card:#fff;--ink:#2a2622;--muted:#7a716a;--line:#ece4d9;--soft:#f6f0e7;
  --accent:#e0703a;--accent-soft:#fdeadf;--ok:#3f9a5b;--ok-soft:#e3f3e7;--warn:#c98a12;--warn-soft:#fbf0d6;--bad:#cf4b45;--bad-soft:#fbe3e1;--gold:#e8a417;
  --sea1:#e3f4fb;--sea2:#c9e8f4;--grass:#a9d88c;--grass2:#8cc56c;
  --hz:"Kaiti SC","STKaiti","KaiTi","Noto Serif SC","Songti SC",serif;
  --ui:-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
}
@media (prefers-color-scheme:dark){:root{--bg:#1b1916;--card:#262320;--ink:#f1ebe3;--muted:#a89f95;--line:#3a3530;--soft:#2f2b27;
  --accent-soft:#4a2f22;--ok-soft:#1f3a28;--warn-soft:#3d321a;--bad-soft:#40211f;--sea1:#14303a;--sea2:#0f2630;--grass:#3e5f2e;--grass2:#2f4c22}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;touch-action:manipulation}
.wrap{max-width:820px;margin:0 auto;padding:max(10px,env(safe-area-inset-top)) 16px 56px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0 10px;flex-wrap:wrap}
.brand{font-weight:800;font-size:19px;display:flex;align-items:center;gap:8px}
.brand .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:20px;background:var(--accent-soft)}
.subj{display:flex;gap:3px;background:var(--soft);border-radius:999px;padding:3px;width:100%}
.subj button{padding:5px 14px;border-radius:999px;font-weight:700;font-size:14px;color:var(--muted)}
.subj button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px #0002}
.score{display:flex;gap:6px}
.score button{display:flex;align-items:center;gap:4px;padding:5px 11px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:800;font-size:15px}
.score .wk.done{background:var(--ok-soft);color:var(--ok);border-color:transparent}
nav.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px}
nav.tabs button{padding:10px 12px;color:var(--muted);font-weight:700;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap;position:relative}
nav.tabs button.on{color:var(--ink);border-color:var(--accent)}
nav.tabs i.em{font-style:normal}
nav.tabs .dot{position:absolute;top:2px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px}
.card+.card{margin-top:12px}
.eyebrow{font-size:13px;color:var(--muted);font-weight:600}
h2{margin:2px 0 6px;font-size:22px}
h3{margin:0 0 6px;font-size:17px;display:flex;align-items:center;gap:8px}
p{margin:6px 0}
.muted{color:var(--muted)}.small{font-size:13px}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.grey{background:var(--soft);color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{padding:11px 16px;border-radius:12px;background:var(--soft);border:1px solid var(--line);font-weight:600}
.btn.pri{background:var(--accent);color:#fff;border-color:transparent}
.btn.ok{background:var(--ok);color:#fff;border-color:transparent}
.btn.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.grow{flex:1}
.btn:disabled{opacity:.35}
.big-btn{display:block;width:100%;margin-top:14px;padding:15px;border-radius:14px;background:var(--accent);color:#fff;font-size:18px;font-weight:700}
.big-btn:disabled{opacity:.4}
.lessons{display:flex;gap:6px;flex-wrap:wrap;padding:2px 0 10px}
.lchip{flex:none;min-width:44px;height:44px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:700}
.lchip.sel{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.chip{font-family:var(--hz);font-size:24px;width:46px;height:46px;border-radius:11px;display:grid;place-items:center;background:var(--soft)}
.chip.sm{width:34px;height:34px;font-size:19px;border-radius:9px}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.mid{background:var(--warn-soft);color:var(--warn)}.chip.bad{background:var(--bad-soft);color:var(--bad)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:9px 8px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px #0002}
.types{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:8px;margin-top:10px}
.type{text-align:left;padding:11px 12px;border-radius:14px;border:2px solid var(--line);background:var(--card);position:relative}
.type b{display:block;font-size:16px}
.type span{font-size:12px;color:var(--muted)}
.type .tag{position:absolute;right:10px;top:10px;font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;background:var(--soft);color:var(--muted)}
.type.on{border-color:var(--accent);background:var(--accent-soft)}
.type.on::after{content:"✓";position:absolute;right:12px;bottom:8px;color:var(--accent);font-weight:800}
.type:disabled{opacity:.4}
details.more summary{cursor:pointer;color:var(--muted);font-size:14px;font-weight:600;margin-top:10px;list-style:none}
details.more summary::before{content:"⚙️ "}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0}
.toggle{width:50px;height:30px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .2s}
.toggle::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px #0003}
.toggle.on{background:var(--ok)}.toggle.on::after{left:23px}
/* ---------- map ---------- */
.map{position:relative;background:linear-gradient(var(--sea1),var(--sea2));border-radius:24px;overflow:hidden;border:1px solid var(--line)}
.map svg.path{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.isl{position:absolute;width:150px;margin-left:-75px;text-align:center}
.isl .disc{position:relative;width:86px;height:86px;border-radius:50%;margin:0 auto;display:grid;place-items:center;font-size:30px;font-weight:900;color:#fff;
  background:radial-gradient(circle at 35% 30%,#ffd28a,#e0703a 70%);box-shadow:0 7px 0 #b4542a,0 12px 18px #0002;transition:transform .15s}
.isl .disc:active{transform:translateY(4px);box-shadow:0 3px 0 #b4542a}
.isl.done .disc{background:radial-gradient(circle at 35% 30%,#b9f0a8,#3f9a5b 70%);box-shadow:0 7px 0 #2d7543,0 12px 18px #0002}
.isl.future .disc{background:radial-gradient(circle at 35% 30%,#f2eee8,#b8b0a6 70%);box-shadow:0 7px 0 #8f877d,0 12px 18px #0002}
.isl.cur .disc::before{content:"";position:absolute;inset:-9px;border-radius:50%;border:4px solid #e0703a88;animation:ring 1.8s ease-out infinite}
.isl .crown{position:absolute;top:-16px;right:-6px;font-size:26px}
.isl .nm{display:inline-block;margin-top:10px;font-size:13px;font-weight:800;background:var(--card);border-radius:99px;padding:2px 10px;box-shadow:0 1px 3px #0002}
.isl .st{font-size:12px;margin-top:3px;letter-spacing:1px}
.isl .st b{color:var(--gold)}
.panda{position:absolute;font-size:40px;animation:bob 1.6s ease-in-out infinite;pointer-events:none;z-index:2}
.deco{position:absolute;font-size:26px;opacity:.85;pointer-events:none}
.wave{position:absolute;font-size:18px;opacity:.5;animation:drift 6s ease-in-out infinite;pointer-events:none}
@keyframes ring{from{transform:scale(.9);opacity:1}to{transform:scale(1.35);opacity:0}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-8px) rotate(4deg)}}
@keyframes drift{0%,100%{transform:translateX(0)}50%{transform:translateX(14px)}}
/* levels */
.lvl{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:var(--soft);margin-top:10px}
.lvl .ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:26px;background:var(--card);flex:none}
.lvl .tx{flex:1;min-width:0}
.lvl .tx b{display:block}
.lvl .tx span{font-size:12px;color:var(--muted)}
.stars3{font-size:18px;letter-spacing:2px;white-space:nowrap}
.stars3 .off{filter:grayscale(1);opacity:.25}
.lvl .go{padding:10px 16px;border-radius:12px;background:var(--accent);color:#fff;font-weight:700;flex:none}
.lvl.lock{opacity:.6}.lvl.lock .go{background:var(--line);color:var(--muted)}
/* runner */
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.x{width:38px;height:38px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:18px;flex:none}
.bar{flex:1;height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--accent));transition:width .4s}
.clock{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:40px;text-align:right}
.done-btn{padding:7px 12px;border-radius:10px;background:var(--ok-soft);color:var(--ok);font-weight:700;font-size:14px}
.stepnav{display:flex;gap:6px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.stepnav::-webkit-scrollbar{display:none}
.stepnav button{flex:none;padding:7px 11px;border-radius:10px;background:var(--soft);font-weight:600;font-size:13px;color:var(--muted);border:2px solid transparent}
.stepnav button.on{border-color:var(--accent);color:var(--ink);background:var(--card)}
.stepnav button.fin{color:var(--ok)}
.stage{text-align:center}
.label{font-size:13px;color:var(--muted);font-weight:600}
.hz{font-family:var(--hz);font-size:128px;line-height:1.1;margin:4px 0}
.py{font-size:26px;color:var(--accent);font-weight:600;min-height:38px}
.meta{font-size:15px;color:var(--muted);min-height:24px}
.spk{width:88px;height:88px;border-radius:50%;background:var(--accent);color:#fff;font-size:38px;margin:12px auto;display:grid;place-items:center;box-shadow:0 6px 0 #b4542a;transition:transform .1s}
.spk:active{transform:translateY(4px);box-shadow:0 2px 0 #b4542a}
.spk.sm{width:58px;height:58px;font-size:24px;margin:8px auto;box-shadow:0 4px 0 #b4542a}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:12px auto 0;max-width:430px}
.opt{font-family:var(--hz);font-size:54px;padding:12px 0;border-radius:18px;background:var(--card);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);transition:transform .1s}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt.pyo{font-family:var(--ui);font-size:30px;padding:18px 0}
.opt.right{border-color:var(--ok);background:var(--ok-soft);box-shadow:0 4px 0 var(--ok);animation:pop .35s}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);opacity:.7}
.bigpy{font-size:46px;font-weight:700;color:var(--accent);margin:10px 0 0}
.ctx{font-family:var(--hz);font-size:34px;margin:6px 0;line-height:1.5}
.ctx u{text-decoration:none;display:inline-block;min-width:1.1em;border-bottom:3px solid var(--accent);color:var(--accent)}
.ctx em{font-style:normal;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:0 4px}
.hint{background:var(--soft);border-radius:12px;padding:12px;margin-top:10px;text-align:left}
.dn{font-size:66px;font-weight:800;color:var(--accent);line-height:1}
.grid-rv{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;margin-top:12px}
.rv{border-radius:14px;padding:8px 4px;background:var(--card);border:2px solid var(--line);text-align:center}
.rv .n{font-size:12px;color:var(--muted)}.rv .c{font-family:var(--hz);font-size:32px;line-height:1.2}
.rv.wrong{border-color:var(--bad);background:var(--bad-soft)}
.qnav{display:flex;gap:10px;margin-top:16px;padding-top:12px;border-top:1px dashed var(--line)}
.qnav button{flex:1;padding:10px;border-radius:12px;font-weight:600;color:var(--muted);background:var(--soft)}
.answered{margin-top:8px;font-weight:700}
.lines{text-align:left;margin-top:8px}
.ln{display:flex;align-items:flex-start;gap:6px;padding:4px 6px;border-radius:10px}
.ln.on{background:var(--accent-soft)}
.ln .tx{flex:1;font-family:var(--hz);font-size:28px;line-height:1.65}
.ln .tx span{border-radius:5px;cursor:pointer}
.ln .tx span.hl{background:var(--gold);color:#fff}
.ln .ls{flex:none;width:36px;height:36px;border-radius:50%;background:var(--soft);font-size:16px;margin-top:6px}
.wordpop{position:sticky;bottom:10px;margin-top:10px;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 14px;display:flex;align-items:center;gap:12px;min-height:56px;animation:pop .25s}
.wordpop b{font-family:var(--hz);font-size:30px;font-weight:400}
.wordpop .p{font-size:18px;color:var(--gold);font-weight:700}
.wordpop button{margin-left:auto;width:40px;height:40px;border-radius:50%;background:#ffffff22;color:inherit;font-size:18px}
.words{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:10px}
.word{padding:8px 14px;border-radius:14px;background:var(--soft);text-align:center;border:2px solid transparent}
.word small{display:block;font-size:13px;color:var(--accent)}
.word b{font-family:var(--hz);font-size:30px;font-weight:400}
.word.on{border-color:var(--accent);background:var(--accent-soft)}
.rad{display:inline-block;margin-top:4px;font-size:13px;background:#3e5d86;color:#fff;border-radius:6px;padding:1px 8px}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
td,th{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--muted);font-weight:600;font-size:12px}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.stat div{background:var(--soft);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:26px}.stat span{font-size:12px;color:var(--muted)}
.earn{display:inline-flex;align-items:center;gap:6px;font-size:22px;font-weight:800;color:var(--gold);background:var(--warn-soft);border-radius:99px;padding:4px 16px;margin-top:8px;animation:pop .5s .2s both}
.bigemoji{font-size:64px;line-height:1.1;animation:jump .9s ease-out}
/* mole game */
.field{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 10px;max-width:440px;margin:12px auto 0;padding:14px 12px 6px;border-radius:24px;background:radial-gradient(circle at 30% 20%,var(--grass),var(--grass2))}
.hole{position:relative;height:118px;overflow:hidden}
.hole .pit{position:absolute;left:6%;right:6%;bottom:6px;height:36px;border-radius:50%;background:radial-gradient(ellipse at 50% 40%,#2c1c0f,#5a3b22 70%)}
.hole .lip{position:absolute;left:2%;right:2%;bottom:0;height:22px;border-radius:0 0 50% 50%/0 0 100% 100%;background:var(--grass2);z-index:3}
.mole{position:absolute;left:50%;bottom:-110px;width:82px;height:96px;margin-left:-41px;border-radius:41px 41px 16px 16px;background:linear-gradient(#b98552,#8a5a32);z-index:2;transition:bottom .22s cubic-bezier(.2,1.4,.5,1);padding:0}
.mole::before{content:"";position:absolute;left:18px;right:18px;top:12px;height:8px;background:radial-gradient(circle,#2a1a0d 3px,transparent 4px) 0 0/22px 8px repeat-x}
.mole b{display:block;margin:22px auto 0;width:60px;height:56px;border-radius:50%;background:#fff3e2;font-family:var(--hz);font-size:40px;line-height:56px;color:#3b2614;font-weight:400}
.mole.up{bottom:12px}
.mole.hit{animation:squash .35s forwards}
.mole.bad{animation:shake .4s}
.mole.bad b{background:#ffd9d6}
.hammer{position:fixed;font-size:46px;pointer-events:none;z-index:40;animation:hammer .35s forwards;transform-origin:80% 80%}
.gamebar{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:800;font-size:18px}
.gamebar .sc{color:var(--gold);font-size:24px}
.combo{font-size:14px;color:var(--accent);font-weight:800;min-height:20px;text-align:center}
@keyframes squash{0%{transform:scale(1)}40%{transform:scale(1.25,.6)}100%{transform:scale(1,.4);bottom:-110px}}
@keyframes hammer{0%{transform:rotate(-50deg) translate(-10px,-30px)}60%{transform:rotate(10deg)}100%{transform:rotate(0);opacity:0}}
/* stickers */
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:10px;margin-top:10px}
.stk{border-radius:16px;padding:8px 4px 6px;text-align:center;background:var(--soft);border:2px dashed var(--line);min-height:100px}
.stk .e{font-size:42px;line-height:1.2}
.stk b{display:block;font-family:var(--hz);font-size:17px;font-weight:400}
.stk small{display:block;font-size:11px;color:var(--muted)}
.stk.got{background:var(--card);border:2px solid var(--line);box-shadow:0 2px 6px #0001}
.stk.rare.got{border-color:var(--gold);background:linear-gradient(160deg,#fff8e1,#ffe7b8)}
@media (prefers-color-scheme:dark){.stk.rare.got{background:linear-gradient(160deg,#4a3a17,#3d2b12)}}
.stk:not(.got) .e{filter:brightness(0);opacity:.12}
.flip{width:220px;height:260px;margin:10px auto;perspective:900px;cursor:pointer}
.flip .in{position:relative;width:100%;height:100%;transition:transform .7s cubic-bezier(.3,1.4,.5,1);transform-style:preserve-3d}
.flip.open .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;border-radius:24px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center;align-content:center}
.flip .f{background:repeating-linear-gradient(45deg,#e0703a,#e0703a 14px,#e8a417 14px,#e8a417 28px);color:#fff;font-size:80px;box-shadow:0 10px 24px #0003}
.flip .b{background:var(--card);border:3px solid var(--line);transform:rotateY(180deg)}
.flip .b.rare{border-color:var(--gold);background:linear-gradient(160deg,#fff8e1,#ffe2a6)}
.flip .b .e{font-size:110px;line-height:1.1}
.flip .b b{font-family:var(--hz);font-size:32px;font-weight:400}
.flip .b small{color:var(--accent);font-size:16px;font-weight:700}
/* badges */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px;margin-top:10px}
.bdg{border-radius:16px;padding:12px 8px;text-align:center;background:var(--soft)}
.bdg .ic{font-size:40px;line-height:1.2}
.bdg b{display:block;font-size:14px;margin-top:2px}
.bdg span{display:block;font-size:11px;color:var(--muted);line-height:1.35;margin-top:2px}
.bdg.got{background:linear-gradient(160deg,#fff6dc,#fde7c2);box-shadow:0 2px 8px #e8a41733}
@media (prefers-color-scheme:dark){.bdg.got{background:linear-gradient(160deg,#4a3a17,#3d2b12)}}
.bdg:not(.got) .ic{filter:grayscale(1);opacity:.4}
.bdg .pg{height:5px;border-radius:9px;background:var(--line);margin:6px 8px 0;overflow:hidden}.bdg .pg i{display:block;height:100%;background:var(--gold)}
.bigstar{font-size:40px;font-weight:900;color:var(--gold)}
.goal{height:14px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:8px}.goal i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--accent))}

.shake{animation:shake .4s}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:45;overflow:hidden}

@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
@keyframes bump{50%{transform:scale(1.25)}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes jump{0%{transform:scale(.3) translateY(30px)}50%{transform:scale(1.15) translateY(-12px)}100%{transform:none}}

.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center;z-index:60}

input.in{padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);width:100%}

function polyItems(chars){const set=chars?new Set(chars):null,out=[];
  D.poly.forEach(([c,ctxs])=>{if(!CH[c]||(set&&!set.has(c)))return;const reads=[...new Set(ctxs.map(x=>x[1]))];
    ctxs.forEach(([ctx,py,n])=>{if(n<=Math.max(curLesson(),CH[c].n))out.push({c,ctx,py,reads})})});return out}
function distractors(c,k){const py=CH[c].py,top=Math.max(curLesson(),CH[c].n);
  const near=shuffle(Object.keys(CH).filter(x=>x!==c&&CH[x].py!==py&&CH[x].n===CH[c].n));
  const far=shuffle(Object.keys(CH).filter(x=>x!==c&&CH[x].py!==py&&CH[x].n!==CH[c].n&&CH[x].n<=top));
  return[...near,...far].slice(0,k)}
function ctxFor(c){const l=L[CH[c].n],lines=[...l.text,l.sent,l.t].filter(Boolean);
  let cl=lines.flatMap(s=>s.replace(/[“”]/g,'').split(/[，。！？：；…]/)).map(s=>s.trim()).filter(s=>s.includes(c)&&s.length>=4);
  if(!cl.length)cl=lines.map(s=>s.replace(/[“”]/g,'').replace(/[。！，]+$/,'')).filter(s=>s.includes(c));
  cl.sort((a,b)=>Math.abs(a.length-8)-Math.abs(b.length-8));return cl[0]||CH[c].h}
function mkItems(type,chars){
  if(type==='poly')return shuffle(polyItems(chars.length?chars:null)).slice(0,TYPES.poly.k).map(q=>({...q,opts:shuffle(q.reads)}));
  return chars.map(c=>{const it={c};
    if(type==='pick'||type==='pyc')it.opts=shuffle([c,...distractors(c,3)]);
    if(type==='fill'){it.s=ctxFor(c);it.opts=shuffle([c,...distractors(c,8).filter(x=>!it.s.includes(x)).slice(0,2)])}
    return it})}
function pickItems(pool,k,n){const own=shuffle(pool.filter(c=>CH[c].n===n)),oth=shuffle(pool.filter(c=>CH[c].n!==n));
  if(!own.length||!oth.length)return shuffle(pool).slice(0,k);
  const ko=Math.min(oth.length,Math.max(1,Math.round(k*oth.length/pool.length)));
  return shuffle([...own.slice(0,k-ko),...oth.slice(0,ko)])}
function examSteps(n){const cs=shuffle(L[n].chars.map(x=>x[0])),pc=new Set(polyItems(cs).map(p=>p.c)),g={},base=['pick','pyc','fill'];let polyUsed=0;
  cs.forEach((c,i)=>{let t=base[i%3];if(pc.has(c)&&polyUsed<2){t='poly';polyUsed++}(g[t]=g[t]||[]).push(c)});
  return ORDER.filter(t=>g[t]).map(t=>({type:t,items:t==='poly'?g.poly.map(c=>{const q=shuffle(polyItems([c]))[0];return{...q,opts:shuffle(q.reads)}}):mkItems(t,g[t])}))}

/* ---------- runner ---------- */
let clk;
function go(kind){const n=view.n,l=L[n];
  if(kind.startsWith('learn')){const p=kind.split(':')[1],all=[{type:'chars',items:l.chars.map(x=>({c:x[0]}))},{type:'words'},{type:'text'}];
    return startRun('learn',p!=null?[all[+p]]:all,n)}
  if(kind==='read')return startRun('read',[{type:'reading'}],n);
  if(kind==='exam')return startRun('exam',examSteps(n),n);
  if(kind==='practice'){const pool=learnPool(),sel=S.types.filter(t=>t!=='poly'||polyItems(pool).length).sort((a,b)=>ORDER.indexOf(a)-ORDER.indexOf(b));
    startRun('practice',sel.map(t=>({type:t,items:mkItems(t,t==='poly'?pool:pickItems(pool,TYPES[t].k,n))})).filter(s=>s.items.length),n)}
}
function dayBonus(sub){const t=today(),arr=sub==='m'?S.m.days:(S.zhDays=S.zhDays||[]);if(!arr.includes(t)){arr.push(t);if(arr.length>500)arr.splice(0,arr.length-500)}
  if(touchDay()){addStars(2,$('#sStar'));toast('今天第一次来学习 +2⭐')}}
function startRun(kind,steps,n){
  stopSpeak();if(!steps.length)return toast('没有可以出的题');
  steps.forEach(s=>{s.ans=[];s.pos=0;if(s.type==='dict')s.wrong=new Set()});
  view.run={kind,n,steps,si:0,t0:Date.now(),stars:0,log:[]};
  dayBonus();save();render();
  clearInterval(clk);clk=setInterval(()=>{const c=$('#clock');if(c&&view.run)c.textContent=fmt(((Date.now()-view.run.t0)/1000)|0)},1000);
}
const isQ=t=>!!TYPES[t];
const qCount=r=>r.steps.filter(s=>isQ(s.type)).reduce((a,s)=>a+s.items.length,0);
const aCount=r=>r.steps.filter(s=>isQ(s.type)).reduce((a,s)=>a+s.ans.filter(Boolean).length,0);
function answer(s,i,ok){if(s.ans[i])return;const it=s.items[i],r=view.run;s.ans[i]={ok};rec(it.c,ok,s.type);r.log.push({c:it.c,ok,type:s.type});
  if(ok){sfx('ok');if(r.kind==='retest'){addStars(2);S.cleared.push([it.c,today()])}else addStars(1);
    if(s.type==='poly')inc('poly');if(s.type==='say')inc('say')}
  else{sfx('no');shake(lastTap)}
  save()}
function stepDone(s){return isQ(s.type)?s.ans.filter(Boolean).length===s.items.length:!!s.fin}
function goStep(si,pos){stopSpeak();const r=view.run;r.si=si;if(pos!=null)r.steps[si].pos=pos;renderRun()}
function advance(){const r=view.run;if(!r)return;const s=r.steps[r.si];stopSpeak();
  const len=s.type==='dict'?s.items.length+1:(s.items||[0]).length;
  if(s.items&&s.pos<len-1){s.pos++;return renderRun()}
  if(!isQ(s.type))s.fin=true;
  if(r.si<r.steps.length-1){r.si++;const t=r.steps[r.si];if(isQ(t.type)){const u=t.items.findIndex((_,i)=>!t.ans[i]);t.pos=u<0?0:u}return renderRun()}
  tryFinish()}
function tryFinish(){const r=view.run,left=qCount(r)-aCount(r);if(left>0&&!r.confirm){r.confirm=true;return renderRun()}finish()}
function quit(){stopSpeak();clearInterval(clk);save();view.run=null;render()}

function renderRun(){
  const r=view.run;if(r.done)return renderDone();
  const s=r.steps[r.si],M=$('#main');
  const names={chars:'跟读生字',words:'跟读词语',text:'读课文',reading:'阅读'},tname=t=>names[t]||TYPES[t].name;

      if(isT)S.textRead[r.n]={d:today(),ok};else{S.readDone[r.n]=today();delete S.readSkip[r.n]}

  const it=s.items[s.pos],a=s.ans[s.pos];
  const head=`${tname(s.type)} · ${Math.min(s.pos+1,s.items.length)}/${s.items.length}${kindTag}`;
  const optBtns=(opts,cls,attr,right)=>`<div class="opts" ${opts.length===3?'style="grid-template-columns:repeat(3,1fr)"':''}>${opts.map(x=>`<button class="opt ${cls} ${a&&x===right?'right':''}" data-${attr}="${x}">${x}</button>`).join('')}</div>`;
  const bindOpts=(attr,right,onRight,say)=>{let tried=!!a;const p0=s.pos;
    $$('.opt').forEach(b=>b.onclick=()=>{if(b.classList.contains('right'))return;
      if(b.dataset[attr]===right){b.classList.add('right');if(!tried)answer(s,s.pos,true);else sfx('ok');onRight&&onRight();setTimeout(()=>{if(view.run===r&&r.steps[r.si]===s&&s.pos===p0&&!r.done)advance()},950)}

    bindOpts('c',c,()=>speak(c),s.type==='pick'?()=>speak(sayChar(c)):null);bindNav();return}
  if(s.type==='fill'){
    card(`${lab(head)}<div class="stage"><div class="ctx">${it.s.split(it.c).map(esc).join(`<u class="bl">${a?it.c:'　'}</u>`)}</div>
      <button class="btn" id="spk">🔊 听这句</button>${optBtns(it.opts,'','c',it.c)}${fb}</div>${qnav()}`);
    $('#spk').onclick=()=>speak(it.s);bindOpts('c',it.c,()=>{$$('.bl').forEach(u=>u.textContent=it.c);speak(it.s)});bindNav();return}
  if(s.type==='poly'){const i=it.ctx.indexOf(it.c);
    card(`${lab(head)}<div class="stage"><div class="muted">句子里的 <b style="color:var(--accent)">${it.c}</b> 读什么？</div>
      <div class="ctx">${esc(it.ctx.slice(0,i))}<em>${it.c}</em>${esc(it.ctx.slice(i+1))}</div>${optBtns(it.opts,'pyo','p',it.py)}${fb}</div>${qnav()}`);
    bindOpts('p',it.py,()=>speak(it.ctx));bindNav();return}
  if(s.type==='read'){const c=it.c;
    card(`${lab(head+' · 👂 家长听')}<div class="stage"><div class="hz">${c}</div><div class="py" id="py">${a?CH[c].py:''}</div><div class="meta" id="mt">${a?esc(CH[c].h):''}</div>
      <button class="btn" id="show">看答案 · 听一听</button>${fb}
      ${a?'':`<div class="row" style="margin-top:14px"><button class="btn bad grow" id="no">没读对</button><button class="btn ok grow" id="yes">读对了 ✓</button></div>`}</div>${qnav()}`);
    $('#show').onclick=()=>{$('#py').textContent=CH[c].py;$('#mt').textContent=CH[c].h;speak(sayChar(c))};
    if(!a){$('#yes').onclick=()=>{answer(s,s.pos,true);setTimeout(advance,500)};$('#no').onclick=()=>{answer(s,s.pos,false);setTimeout(advance,500)}}bindNav();return}
  if(s.type==='say'){const c=it.c;
    card(`${lab(head+' · 👂 家长听')}<div class="stage"><div class="hz" style="font-size:96px">${c}</div>

      ${a?'':`<div class="row" style="margin-top:14px"><button class="btn bad grow" id="no">再练练</button><button class="btn ok grow" id="yes">说得好 ✓</button></div>`}</div>${qnav()}`);

        <button class="spk" id="spk">🔊</button>

function tokens(line,li){return[...line].map((ch,j)=>/[一-鿿]/.test(ch)?`<span data-j="${j}" data-li="${li}">${ch}</span>`:ch).join('')}
function tapWord(sp,lines){stopSpeak();const li=+sp.dataset.li,j=+sp.dataset.j,line=lines[li],ch=line[j],l=L[view.run.n];
  let w=null,k=j,p='';$$('.ln').forEach(x=>x.classList.remove('on'));
  const all=[...(l.words||[]),...D.lessons.filter(x=>x!==l).flatMap(x=>x.words||[])];
  for(const[ww,pp]of all.sort((a,b)=>b[0].length-a[0].length)){let x=line.indexOf(ww);while(x>=0){if(x<=j&&j<x+ww.length){w=ww;k=x;p=pp;break}x=line.indexOf(ww,x+1)}if(w)break}
  if(!w){w=ch;p=CH[ch]?CH[ch].py:'';if('的了着吗呢吧么啦呀'.includes(ch)&&j>0&&/[一-鿿]/.test(line[j-1])){w=line[j-1]+ch;k=j-1;p=''}}
  $$('.tx span').forEach(x=>x.classList.toggle('hl',+x.dataset.li===li&&+x.dataset.j>=k&&+x.dataset.j<k+w.length));
  $('#wp').innerHTML=`<div class="wordpop"><b>${esc(w)}</b><span class="p">${esc(p)}</span><button id="wps" aria-label="再听">🔊</button></div>`;
  const say=()=>speak(w);$('#wps').onclick=say;say()}

/* ---------- after any session: levels, sticker, badges ---------- */
function afterSession(kind,n,g,extra){
  const res={draw:false};
  if(kind==='practice'&&g.length>=6)S.best2[n]=Math.max(S.best2[n]||0,accStars(g.filter(x=>x.ok).length/g.length));
  if(kind==='exam'&&g.length){const k=accStars(g.filter(x=>x.ok).length/g.length);S.best3[n]=Math.max(S.best3[n]||0,k);
    if(k===3&&!S.examBonus[n]){S.examBonus[n]=today();S.draws++;res.draw=true;res.examBonus=true}}
  const meaningful=g.length>=5||kind==='learn'||kind==='read'||(extra&&extra.rounds>=5);
  if(meaningful&&S.drawDay!==today()){S.drawDay=today();S.draws++;res.draw=true}
  save();res.badges=checkBadges();return res}
function finish(){
  const r=view.run;r.done=true;r.confirm=false;clearInterval(clk);stopSpeak();r.secs=((Date.now()-r.t0)/1000)|0;const g=r.log;
  if(r.kind==='learn'&&r.steps.some(s=>s.type==='chars'&&s.fin)&&r.steps.some(s=>s.type==='text'&&s.fin))S.learnDone[r.n]=today();
  if(g.length>=10&&g.every(x=>x.ok)){inc('full');addStars(5,$('#sStar'));r.fullBonus=true}
  if(g.length||r.kind==='learn'||r.kind==='read')S.sessions.unshift({d:today(),n:r.n,kind:r.kind,types:r.steps.map(s=>s.type),items:g.length,ok:g.filter(x=>x.ok).length,secs:r.secs,stars:r.stars});
  S.sessions=S.sessions.slice(0,200);r.after=afterSession(r.kind,r.n,g);renderDone();
  const okRate=g.length?g.filter(x=>x.ok).length/g.length:1;if(okRate>=.8){confetti();sfx('fan')}
  setTimeout(()=>showBadges(r.after.badges),900);
}
function rewardBits(after){return after&&after.draw?`<button class="big-btn" id="stk" style="background:linear-gradient(90deg,var(--gold),var(--accent))">🎁 ${after.examBonus?'三星通关！':''}你有一张新贴纸，点开看看！</button>`:''}
function bindReward(){const b=$('#stk');if(b)b.onclick=()=>openSticker(()=>{b.remove()})}
function renderDone(){
  const r=view.run,g=r.log,earn=`<div class="earn">+${r.stars||0} ⭐</div>`;paintScore();
  if(!g.length){
    $('#main').innerHTML=`<section class="card"><div class="stage"><div class="bigemoji">👏</div><h2>${r.kind==='learn'?(S.learnDone[r.n]===today()?'第 1 关完成！':'跟读完成！'):r.kind==='read'?'读完啦！':'结束啦'}</h2>
      ${r.kind==='learn'?`<div style="margin-top:6px;font-size:26px">${st3(levels(r.n)[0])}</div>`:''}${earn}<div class="muted" style="margin-top:6px">用时 ${fmt(r.secs)}</div></div>
      ${rewardBits(r.after)}
      <div class="row" style="margin-top:14px"><button class="btn pri grow" id="pr">去第 2 关 →</button><button class="btn grow" id="bk">回到这一课</button></div></section>`;
    bindReward();$('#pr').onclick=()=>{view.run=null;go('practice')};$('#bk').onclick=()=>{view.run=null;view.tab='learn';view.open=true;render()};return}
  const by={};g.forEach(x=>(by[x.c]=by[x.c]||[]).push(x.ok));
  const cs=Object.keys(by),cls=c=>by[c].every(Boolean)?'ok':by[c].some(Boolean)?'mid':'bad',wrong=cs.filter(c=>cls(c)!=='ok');
  const skipped=qCount(r)-aCount(r),acc=g.filter(x=>x.ok).length/g.length,lvlK=(r.kind==='practice'&&g.length>=6)||r.kind==='exam'?accStars(acc):null;
  $('#main').innerHTML=`<section class="card"><div class="stage"><div class="bigemoji">${acc>=.8?'🎉':'💪'}</div>
    <h2>${{retest:'错字本考完了！',review:'复习完成！',exam:'通关考试结束！',practice:'练习完成！'}[r.kind]}</h2>
    ${lvlK!=null?`<div style="font-size:30px">${st3(lvlK)}</div><div class="small muted">${r.kind==='exam'?'第 3 关':'第 2 关'}${lvlK?'':' · 对 60% 以上才有星，再试一次！'}</div>`:''}
    ${earn}${r.fullBonus?'<div class="small" style="color:var(--gold);font-weight:700">全对奖励 +5⭐</div>':''}
    <div class="muted" style="margin-top:6px">用时 ${fmt(r.secs)} · ${g.length} 题 · 对 ${g.filter(x=>x.ok).length} 题${skipped?` · 跳过 ${skipped} 题`:''}</div></div>
    <div class="chips" style="justify-content:center;margin-top:12px">${cs.map(c=>`<span class="chip ${cls(c)}">${c}</span>`).join('')}</div>
    ${r.kind==='retest'?`<div class="hint">🧹 消灭了 <b>${cs.filter(c=>cls(c)==='ok').length}</b> 个错字。${wrong.length?`还剩 <b style="font-family:var(--hz);font-size:20px">${wrong.join(' ')}</b> 在错字本里。`:''}</div>`
      :wrong.length?`<div class="hint">📕 <b style="font-family:var(--hz);font-size:20px">${wrong.join(' ')}</b> 记进了错字本。<br><span class="muted small">一个字要在两个不同的日子都做对，才算真正掌握。</span></div>`:''}
    ${rewardBits(r.after)}
    <div class="row" style="margin-top:14px">${wrong.length?`<button class="btn pri grow" id="redo">刚才错的，马上再练一次</button>`:''}<button class="btn grow" id="bk">回去</button></div></section>`;
  bindReward();
  if($('#redo'))$('#redo').onclick=()=>{const w=wrong.filter(c=>status(c)==='bad');view.run=null;w.length?startRun('retest',retestSteps(w),r.n):render()};
  $('#bk').onclick=()=>{view.run=null;if(r.kind==='retest')view.tab='wrong';else if(r.kind==='review')view.tab='review';else{view.tab='learn';view.open=true}render()};
}

/* ---------- 打地鼠 ---------- */
function startGame(mode,pool,n,from){

  view.game={mode,pool,n,from:from||'lesson',score:0,round:0,combo:0,maxCombo:0,stars:0,log:[],
    total:mode==='practice'?Math.min(10,Math.max(6,pool.length)):Infinity,t0:Date.now(),left:60,phase:'ready',seen:{},rid:0};
  dayBonus();render()}
function renderGame(){
  const G=view.game,M=$('#main');
  if(G.phase==='end')return renderGameEnd();
  M.innerHTML=`<section class="card">

function pickTarget(G){const rank={bad:0,new:1,mid:2,ok:3};return shuffle(G.pool).sort((a,b)=>(G.seen[a]||0)-(G.seen[b]||0)||rank[status(a)]-rank[status(b)])[0]}
async function nextRound(){const G=view.game;if(!G||G.phase!=='play')return;
  if(G.round>=G.total)return endGame();

}

  const h=document.createElement('span');h.className='hammer';h.textContent='🔨';h.style.left=(e.clientX-30)+'px';h.style.top=(e.clientY-45)+'px';document.body.appendChild(h);setTimeout(()=>h.remove(),400);
  if(m.dataset.c===G.target){clearTimeout(G.hideT);m.classList.add('hit');sfx('whack');G.score++;const s=$('#gs');if(s){s.textContent=G.score;s.parentNode.classList.remove('bump');void s.offsetWidth;s.parentNode.classList.add('bump')}
    if(!G.tried){rec(G.target,true,'mole');G.log.push({c:G.target,ok:true});G.combo++;G.maxCombo=Math.max(G.maxCombo,G.combo);addStars(1,m);
      $('#gcombo').textContent=G.combo>=3?`🔥 连击 ×${G.combo}！`:'打中了！'}else $('#gcombo').textContent='打中了！';
    G.rid++;$$('.mole').forEach(x=>{if(x!==m)x.classList.remove('up')});G.round++;save();setTimeout(nextRound,500)}
  else{m.classList.add('bad');sfx('no');setTimeout(()=>{m.classList.remove('up');m.dataset.c=''},380);
    if(!G.tried){G.tried=true;rec(G.target,false,'mole');G.log.push({c:G.target,ok:false});save()}G.combo=0;$('#gcombo').textContent='不是这只，再听一遍～';
    setTimeout(()=>{if(view.game===G)speak(sayChar(G.target))},300)}}
function endGame(quitting){const G=view.game;if(!G||G.phase==='end')return;clearInterval(G.tick);clearTimeout(G.hideT);stopSpeak();G.rid++;

/* ====================== 数学：口算速度 + 准确率 ====================== */
const RI=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.random()*a.length|0];
const dg=(n,i)=>Math.floor(n/10**i)%10;
const carries=(a,b)=>{let c=0,n=0;for(let i=0;i<4;i++){c=dg(a,i)+dg(b,i)+c>=10?1:0;n+=c}return n};
const borrows=(a,b)=>{let c=0,n=0;for(let i=0;i<4;i++){c=dg(a,i)-dg(b,i)-c<0?1:0;n+=c}return n};
const until=(f,ok)=>{for(let i=0;i<500;i++){const r=f();if(ok(r))return r}throw new Error('gen')};
const PL=(a,b)=>({q:`${a} + ${b}`,ans:String(a+b),a,b,op:'+'});
const MI=(a,b)=>({q:`${a} − ${b}`,ans:String(a-b),a,b,op:'−'});
const TI=(a,b)=>({q:`${a} × ${b}`,ans:String(a*b),a,b,op:'×'});
const VT=x=>(x.vert=1,x);
const sw=(a,b)=>Math.random()<.5?[a,b]:[b,a];
function exprFor(w){if(w>=20&&(Math.random()<.5||w>69)){const x=RI(10,w-10);return`${x} + ${w-x}`}const y=RI(5,29);return`${w+y} − ${y}`}
const MG=[['A','🔢 口算基础（100 以内）'],['B','🧱 三位数加减'],['C','✖️ 乘法'],['D','🧩 拓展']];
const MS=[
 {id:'a1',g:'A',name:'20 以内进位加、退位减',eg:'8 + 7　15 − 9',t:3,gen(){const[a,b]=until(()=>[RI(2,9),RI(2,9)],([a,b])=>a+b>=11);return Math.random()<.5?PL(...sw(a,b)):MI(a+b,pick([a,b]))}},
 {id:'a2',g:'A',name:'整十、整百加减',eg:'30 + 50　700 − 200',t:3,gen(){const k=RI(0,3);
   if(k===0){const a=RI(1,9),b=RI(1,10-a);return PL(a*10,b*10)}
   if(k===1){const a=RI(2,10),b=RI(1,a-1);return MI(a*10,b*10)}
   if(k===2){const a=RI(1,8),b=RI(1,9-a);return Math.random()<.5?PL(a*100,b*100):MI((a+b)*100,b*100)}
   if(Math.random()<.5){const a=until(()=>RI(11,89),x=>x%10),b=10*RI(1,Math.floor((99-a)/10));return PL(a,b)}
   const a=until(()=>RI(21,99),x=>x%10),b=10*RI(1,Math.floor(a/10)-1);return MI(a,b)}},
 {id:'a3',g:'A',name:'两位数加减一位数',eg:'47 + 8　53 − 7',t:4,gen(){const c=Math.random()<.7;
   if(Math.random()<.5){const[a,b]=until(()=>[RI(11,94),RI(2,9)],([a,b])=>a+b<=100&&(a%10+b>=10)===c);return PL(a,b)}
   const[a,b]=until(()=>[RI(20,99),RI(2,9)],([a,b])=>(a%10<b)===c);return MI(a,b)}},
 {id:'a4',g:'A',name:'两位数加减（不进位、不退位）',eg:'34 + 25　78 − 43',t:6,gen(){
   if(Math.random()<.5){const[a,b]=until(()=>[RI(10,88),RI(10,88)],([a,b])=>a%10+b%10<10&&a+b<=99);return PL(a,b)}
   const[a,b]=until(()=>[RI(21,99),RI(10,89)],([a,b])=>a-b>=10&&a%10>=b%10);return MI(a,b)}},
 {id:'a5',g:'A',name:'两位数加减（进位、退位）',eg:'38 + 47　72 − 39',t:8,gen(){
   if(Math.random()<.5){const[a,b]=until(()=>[RI(11,89),RI(11,89)],([a,b])=>a%10+b%10>=10&&a+b<=100);return PL(a,b)}
   const[a,b]=until(()=>[RI(21,99),RI(11,89)],([a,b])=>a-b>=5&&a%10<b%10);return MI(a,b)}},
 {id:'a6',g:'A',name:'填空 □',eg:'27 + □ = 63',t:8,gen(){const c=Math.random()<.5;
   if(Math.random()<.5){const[a,b]=until(()=>[RI(11,89),RI(11,89)],([a,b])=>a+b<=100&&(a%10+b%10>=10)===c),s=a+b;
     return Math.random()<.5?{q:`${a} + □ = ${s}`,ans:String(b),inv:a+s}:{q:`□ + ${b} = ${s}`,ans:String(a),inv:b+s}}
   const[a,b]=until(()=>[RI(21,99),RI(11,89)],([a,b])=>a>b&&(a%10<b%10)===c),d=a-b;
   return Math.random()<.5?{q:`${a} − □ = ${d}`,ans:String(b),inv:a+d}:{q:`□ − ${b} = ${d}`,ans:String(a),inv:d-b}}},
 {id:'b1',g:'B',name:'三位数加减（不进位、不退位）',eg:'324 + 152　685 − 243',t:10,gen(){const two=Math.random()<.25;
   if(Math.random()<.5){const[a,b]=until(()=>[RI(100,899),two?RI(10,99):RI(100,899)],([a,b])=>a+b<=999&&!carries(a,b));return VT(PL(a,b))}
   const[a,b]=until(()=>[RI(200,999),two?RI(10,99):RI(100,899)],([a,b])=>a-b>=20&&!borrows(a,b));return VT(MI(a,b))}},
 {id:'b2',g:'B',name:'三位数加法（进位）',eg:'368 + 457',t:14,gen(){const two=Math.random()<.25;
   const[a,b]=until(()=>[RI(100,899),two?RI(10,99):RI(100,899)],([a,b])=>a+b<=999&&carries(a,b)>=1);return VT(PL(a,b))}},
 {id:'b3',g:'B',name:'三位数减法（退位）',eg:'642 − 278',t:16,gen(){const two=Math.random()<.25;
   const[a,b]=until(()=>[RI(200,999),two?RI(10,99):RI(100,899)],([a,b])=>a-b>=10&&borrows(a,b)>=1&&dg(a,1)!==0);return VT(MI(a,b))}},
 {id:'b4',g:'B',name:'中间有 0 的退位减',eg:'503 − 278',t:18,gen(){const h=RI(2,9),o=Math.random()<.3?0:RI(0,8),a=h*100+o;

 {id:'c1',g:'C',name:'乘法口诀 ×2 ×5 ×10',eg:'5 × 7　10 × 6',t:3,gen(){return TI(...sw(pick([2,5,10]),RI(2,10)))}},

function m3(b,l,s,path){

  if(typeof l==='number'&&typeof s==='number'){if(COUNTERS.has(path)||path.startsWith('cnt.'))return s+l-(typeof b==='number'?b:0);if(MAXK.test(path))return Math.max(l,s);return l}
  if(Array.isArray(l)&&Array.isArray(s)){const seen=new Set(s.map(J)),out=[...s];l.forEach(x=>{const k=J(x);if(!seen.has(k)){seen.add(k);out.push(x)}});
    if(path==='sessions')out.sort((x,y)=>String(y.d).localeCompare(String(x.d)));return out}
  if(l&&s&&typeof l==='object'&&typeof s==='object'&&!Array.isArray(l)&&!Array.isArray(s)){const o={},bb=b&&typeof b==='object'?b:{};
    new Set([...Object.keys(l),...Object.keys(s)]).forEach(k=>{const v=m3(bb[k],l[k],s[k],path?path+'.'+k:k);if(v!==undefined)o[k]=v});return o}
  return l}
const isBusy=()=>!!(view.run||view.game||view.mrun);
const fresh=()=>!S.sessions.length&&!S.stars;
function syAdopt(data,rev){S={...DEF,...data};mInit();SY.rev=rev;SY.dirty=false;setBase(data);save(true)}
const syQ=()=>{const u=syncUrl();return u+(u.includes('?')?'&':'?')+'key='+encodeURIComponent(SY.code)+'&kid='+KID+'&t='+Date.now()};
async function syFetch(body){const o={cache:'no-store',credentials:'omit',redirect:'follow'};
  const r=body?await fetch(syncUrl(),{...o,method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:J(body)}):await fetch(syQ(),o);
  if(!r.ok)throw new Error('HTTP '+r.status);const t=await r.text();try{return JSON.parse(t)}catch(e){throw new Error('回应不是数据：'+t.slice(0,40))}}
// 备用通道：有的设备/网络挡了跨域 fetch，就用 <script> 读（JSONP），写的时候用 no-cors POST 再读回来确认
function syJsonp(){return new Promise((res,rej)=>{const cb='__sy'+Date.now()+(Math.random()*1e4|0),s=document.createElement('script');let done=false;
  const end=e=>{if(done)return;done=true;clearTimeout(t);delete window[cb];s.remove();e?rej(e):0};
  window[cb]=d=>{end();res(d)};s.onerror=()=>end(new Error('备用通道也连不上'));const t=setTimeout(()=>end(new Error('备用通道超时')),20000);
  s.src=syQ()+'&callback='+cb;document.head.appendChild(s)})}
async function syReqAlt(body){if(!body)return syJsonp();
  await fetch(syncUrl(),{method:'POST',mode:'no-cors',cache:'no-store',credentials:'omit',body:J(body)});
  const s=await syJsonp();if(!s.ok)return s;
  if(s.rev===body.baseRev+1&&J(s.data)===J(body.data))return{ok:true,rev:s.rev};
  if(s.rev!==body.baseRev)return{ok:false,conflict:true,rev:s.rev,data:s.data};
  throw new Error('上传没成功')}
async function syReq(body){
  if(SY.alt)return syReqAlt(body);
  try{return await syFetch(body)}catch(e){SY.fetchErr=String(e&&e.message||e);
    const r=await syReqAlt(body);SY.alt=true;sySave();return r}}
let syT=null,syBusy=false;
function syncDirty(){if(!syncOn())return;SY.dirty=true;sySave();clearTimeout(syT);syT=setTimeout(()=>syncNow(),2500)}
async function syncNow(){if(!syncOn()||syBusy||!navigator.onLine)return;syBusy=true;let changed=false;
  try{let r=await syReq();if(!r.ok)throw new Error(r.err==='key'?'同步码不对':r.err||'云端出错');
    for(let tries=0;;tries++){
      if(r.rev!==SY.rev&&r.data){
        if(isBusy()){SY.later=true;break}
        if(!SY.dirty){syAdopt(r.data,r.rev);changed=true;break}
        const m=m3(getBase()||{},JSON.parse(J(S)),r.data,'');S={...DEF,...m};mInit();SY.rev=r.rev;save(true);changed=true}
      else if(!SY.dirty){SY.rev=r.rev;break}
      const data=JSON.parse(J(S)),p=await syReq({key:SY.code,kid:KID,baseRev:SY.rev||0,data});
      if(p.ok){SY.rev=p.rev;SY.dirty=false;setBase(data);break}
      if(p.conflict&&tries<3){r=p;continue}
      throw new Error(p.err==='key'?'同步码不对':'上传失败')}
    SY.last=Date.now();SY.err=''}
  catch(e){SY.err=(e instanceof TypeError?'暂时连不上网，联网后会自动补传':String(e&&e.message||e))+(SY.fetchErr?'（'+SY.fetchErr+'）':'')}
  finally{syBusy=false;sySave();paintSync();if(changed&&!isBusy()&&!$('#modal').innerHTML)render()}}
function paintSync(){const el=$('#syncSt');if(!el)return;
  el.innerHTML=SY.err?`<span style="color:var(--bad)">⚠️ ${esc(SY.err)}</span>`:SY.last?`✓ 上次同步 ${md(dstr(new Date(SY.last)))} ${new Date(SY.last).toTimeString().slice(0,5)}${SY.dirty?' · 有新记录等上传':''}`:'连接中…'}
async function syncLink(code){code=code.trim().toLowerCase();if(!code)return toast('请输入同步码');if(!syncUrl())return toast('云端还没设置好');
  SY.code=code;let r;try{r=await syReq()}catch(e){return toast('连不上云端：'+(e&&e.message||e)+(SY.fetchErr?' / '+SY.fetchErr:''))}
  if(!r.ok){SY.code='';return toast(r.err==='key'?'同步码不对':'云端出错')}
  const go=mode=>{$('#modal').innerHTML='';SY.linked=true;
    if(mode==='cloud')syAdopt(r.data,r.rev);
    else{SY.rev=r.data?r.rev:(r.rev||0);setBase({});SY.dirty=true;if(r.data){const m=m3({},JSON.parse(J(S)),r.data,'');S={...DEF,...m};mInit();save(true)}}
    sySave();toast('已连接，开始同步');render();syncNow()};
  if(!r.data||fresh())return go(r.data?'cloud':'mine');
  $('#modal').innerHTML=`<div class="modal"><div class="box"><div class="ic" style="font-size:56px">☁️</div><h2>云端已经有记录了</h2>
    <p class="muted small">这台设备上也有记录（⭐ ${S.stars}，${S.sessions.length} 次练习）。云端是别的设备上传的。</p>
    <button class="big-btn" id="syM">合并两边（推荐）</button><p class="small muted">星星、贴纸、徽章、错题都合在一起。</p>
    <button class="btn" style="width:100%;margin-top:6px" id="syC">只用云端的，这台的不要了</button>
    <button class="btn ghost" style="width:100%;margin-top:6px" id="syX">先不连</button></div></div>`;
  $('#syM').onclick=()=>go('mine');$('#syC').onclick=()=>go('cloud');$('#syX').onclick=()=>{SY.code='';$('#modal').innerHTML=''}}
function syncCard(){
  return`<section class="card"><h3>☁️ 多设备同步</h3>
    ${syncOn()?`<p class="small muted">这台设备已经连上，记录会自动和其他设备互通（存在妈妈的 Google Drive，每天自动另存一份备份）。</p>
      <div class="small" id="syncSt"></div>
      <div class="row" style="margin-top:8px"><button class="btn grow" id="syNow">立即同步</button><button class="btn ghost grow" id="syOff">这台设备断开</button></div>`
    :syncUrl()?`<p class="small muted">在每台设备上输一次同步码，星星、徽章、错题就会自动互通。</p>
      <div class="row"><input class="in" id="syCode" placeholder="同步码" autocapitalize="off" autocomplete="off" style="flex:1"><button class="btn pri" id="syGo">连接</button></div>`
    :`<p class="small muted">云端还没设置好。</p>`}
    <details class="more"><summary>高级</summary><input class="in" id="syUrl" placeholder="同步网址（一般不用填）" value="${esc(SY.url||'')}" style="margin-top:8px"><button class="btn" style="margin-top:6px" id="syUrlS">保存网址</button></details>
  </section>`}
function bindSync(){paintSync();
  if($('#syGo'))$('#syGo').onclick=()=>syncLink($('#syCode').value);
  if($('#syNow'))$('#syNow').onclick=async()=>{SY.err='';paintSync();await syncNow();toast(SY.err?'同步失败：'+SY.err:'同步好了')};
  if($('#syOff'))$('#syOff').onclick=()=>{SY={url:SY.url};sySave();toast('这台设备已断开，记录还在本机');render()};
  $('#syUrlS').onclick=()=>{SY.url=$('#syUrl').value.trim();SY.linked=false;sySave();render()}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')syncNow();else if(SY.dirty)syncNow()});
window.addEventListener('online',()=>syncNow());


render();
syncNow();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
