<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Eric学习">
<meta name="theme-color" content="#e0703a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Eric 的学习小站</title>
<style>
:root{
  --bg:#fbf7f1;--card:#fff;--ink:#2a2622;--muted:#7a716a;--line:#ece4d9;--soft:#f6f0e7;
  --accent:#e0703a;--accent-soft:#fdeadf;--ok:#3f9a5b;--ok-soft:#e3f3e7;--warn:#c98a12;--warn-soft:#fbf0d6;--bad:#cf4b45;--bad-soft:#fbe3e1;--gold:#e8a417;
  --sea1:#e3f4fb;--sea2:#c9e8f4;--grass:#a9d88c;--grass2:#8cc56c;
  --hz:"Kaiti SC","STKaiti","KaiTi","Noto Serif SC","Songti SC",serif;
  --slate:#20333a;--bronze:#9c6420;--jade:var(--ok);--red:var(--bad);--serif:var(--hz);--mute:var(--muted);--sans:var(--ui);
  --ui:-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
}
@media (prefers-color-scheme:dark){:root{--bg:#1b1916;--card:#262320;--ink:#f1ebe3;--muted:#a89f95;--line:#3a3530;--soft:#2f2b27;
  --accent-soft:#4a2f22;--ok-soft:#1f3a28;--warn-soft:#3d321a;--bad-soft:#40211f;--sea1:#14303a;--sea2:#0f2630;--grass:#3e5f2e;--grass2:#2f4c22}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;touch-action:manipulation}
.wrap{max-width:820px;margin:0 auto;padding:max(10px,env(safe-area-inset-top)) 16px 56px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0 10px;flex-wrap:wrap}
.brand{font-weight:800;font-size:19px;display:flex;align-items:center;gap:8px}
.brand .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:20px;background:var(--accent-soft)}
.subj{display:flex;gap:3px;background:var(--soft);border-radius:999px;padding:3px;width:100%}
.subj button{padding:5px 14px;border-radius:999px;font-weight:700;font-size:14px;color:var(--muted)}
.subj button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px #0002}
.score{display:flex;gap:6px}
.score button{display:flex;align-items:center;gap:4px;padding:5px 11px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:800;font-size:15px}
.score .wk.done{background:var(--ok-soft);color:var(--ok);border-color:transparent}
nav.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px}
nav.tabs button{padding:10px 12px;color:var(--muted);font-weight:700;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap;position:relative}
nav.tabs button.on{color:var(--ink);border-color:var(--accent)}
nav.tabs i.em{font-style:normal}
nav.tabs .dot{position:absolute;top:2px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px}
.card+.card{margin-top:12px}
.eyebrow{font-size:13px;color:var(--muted);font-weight:600}
h2{margin:2px 0 6px;font-size:22px}
h3{margin:0 0 6px;font-size:17px;display:flex;align-items:center;gap:8px}
p{margin:6px 0}
.muted{color:var(--muted)}.small{font-size:13px}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.grey{background:var(--soft);color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{padding:11px 16px;border-radius:12px;background:var(--soft);border:1px solid var(--line);font-weight:600}
.btn.pri{background:var(--accent);color:#fff;border-color:transparent}
.btn.ok{background:var(--ok);color:#fff;border-color:transparent}
.btn.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.grow{flex:1}
.btn:disabled{opacity:.35}
.big-btn{display:block;width:100%;margin-top:14px;padding:15px;border-radius:14px;background:var(--accent);color:#fff;font-size:18px;font-weight:700}
.big-btn:disabled{opacity:.4}
.lessons{display:flex;gap:6px;flex-wrap:wrap;padding:2px 0 10px}
.lchip{flex:none;min-width:44px;height:44px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:700}
.lchip.sel{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.chip{font-family:var(--hz);font-size:24px;width:46px;height:46px;border-radius:11px;display:grid;place-items:center;background:var(--soft)}
.chip.sm{width:34px;height:34px;font-size:19px;border-radius:9px}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.mid{background:var(--warn-soft);color:var(--warn)}.chip.bad{background:var(--bad-soft);color:var(--bad)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:9px 8px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px #0002}
.types{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:8px;margin-top:10px}
.type{text-align:left;padding:11px 12px;border-radius:14px;border:2px solid var(--line);background:var(--card);position:relative}
.type b{display:block;font-size:16px}
.type span{font-size:12px;color:var(--muted)}
.type .tag{position:absolute;right:10px;top:10px;font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;background:var(--soft);color:var(--muted)}
.type.on{border-color:var(--accent);background:var(--accent-soft)}
.type.on::after{content:"✓";position:absolute;right:12px;bottom:8px;color:var(--accent);font-weight:800}
.type:disabled{opacity:.4}
details.more summary{cursor:pointer;color:var(--muted);font-size:14px;font-weight:600;margin-top:10px;list-style:none}
details.more summary::before{content:"⚙️ "}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0}
.toggle{width:50px;height:30px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .2s}
.toggle::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px #0003}
.toggle.on{background:var(--ok)}.toggle.on::after{left:23px}
/* ---------- map ---------- */
.map{position:relative;background:linear-gradient(var(--sea1),var(--sea2));border-radius:24px;overflow:hidden;border:1px solid var(--line)}
.map svg.path{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.isl{position:absolute;width:150px;margin-left:-75px;text-align:center}
.isl .disc{position:relative;width:86px;height:86px;border-radius:50%;margin:0 auto;display:grid;place-items:center;font-size:30px;font-weight:900;color:#fff;
  background:radial-gradient(circle at 35% 30%,#ffd28a,#e0703a 70%);box-shadow:0 7px 0 #b4542a,0 12px 18px #0002;transition:transform .15s}
.isl .disc:active{transform:translateY(4px);box-shadow:0 3px 0 #b4542a}
.isl.done .disc{background:radial-gradient(circle at 35% 30%,#b9f0a8,#3f9a5b 70%);box-shadow:0 7px 0 #2d7543,0 12px 18px #0002}
.isl.future .disc{background:radial-gradient(circle at 35% 30%,#f2eee8,#b8b0a6 70%);box-shadow:0 7px 0 #8f877d,0 12px 18px #0002}
.isl.cur .disc::before{content:"";position:absolute;inset:-9px;border-radius:50%;border:4px solid #e0703a88;animation:ring 1.8s ease-out infinite}
.isl .crown{position:absolute;top:-16px;right:-6px;font-size:26px}
.isl .mon{position:absolute;bottom:-8px;left:-12px;font-size:24px;filter:drop-shadow(0 2px 2px #0004)}.isl .mon.beat{font-size:20px;opacity:.85}
.bossgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin-top:8px}
.bossgrid>div{border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center;background:var(--soft)}.bossgrid>div.beat{border-color:var(--ok);background:var(--ok-soft)}
.bossgrid span{display:block;font-size:30px;line-height:1.2}.bossgrid b{display:block;font-size:14px}.bossgrid small{display:block;font-size:11px;color:var(--muted)}
/* 10 分钟冒险 */
.gocard{text-align:center}.goflow{display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap;font-size:22px;margin-bottom:6px}
.goflow span{display:flex;flex-direction:column;align-items:center;line-height:1.1}.goflow b{font-size:12px;color:var(--muted);font-weight:700;margin-top:2px}.goflow i{font-style:normal;color:var(--muted)}
.gobtn{font-size:22px;padding:18px;margin-top:8px}
.abwrap{max-width:320px;margin:12px auto 0;text-align:left}.abrow{display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-weight:700;font-size:15px}
.gocard .row{justify-content:center;text-align:left}
details.more2 summary{cursor:pointer;font-weight:700;color:var(--muted)}details.more2 .lvl{margin-top:8px}
.partnav{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin:8px 0 4px;font-size:13px;font-weight:700}
.partnav span{padding:5px 10px;border-radius:99px;background:var(--soft);color:var(--muted)}.partnav span.on{background:var(--accent);color:#fff}.partnav span.fin{color:var(--ok)}.partnav i{font-style:normal;color:var(--muted)}
.qq{font-size:22px;font-weight:700;margin:10px 0 4px}.reveal{font-family:var(--hz);font-size:22px;margin:6px 0;color:var(--accent)}
.qopts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px}.qopts.n3{grid-template-columns:repeat(3,1fr)}
.qo{position:relative;border:2px solid var(--line);background:var(--card);border-radius:16px;padding:12px 6px;min-height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.qo .oe{font-size:44px;line-height:1.1}.qo .ol{font-family:var(--hz);font-size:22px;font-weight:700}
.qo.right{border-color:var(--ok);background:var(--ok-soft)}.qo.wrong{border-color:var(--bad);background:var(--bad-soft);animation:shake .35s}
.qo .os{position:absolute;top:4px;right:6px;font-size:16px;opacity:.7}
.dlg{display:flex;flex-direction:column;gap:8px;margin:10px auto;max-width:460px}.bub{display:flex;align-items:center;gap:8px}.bub span{font-size:34px}
.bub i{font-style:normal;background:var(--soft);border-radius:16px;padding:10px 14px;font-family:var(--hz);font-size:21px;text-align:left}.bub.r{justify-content:flex-end}
.qcard{max-width:360px;margin:8px auto;background:#fffaf0;border:2px dashed #e0b070;border-radius:14px;padding:14px 18px;font-family:var(--hz);font-size:22px;line-height:1.6;text-align:left;color:#3a2a1a}
.qcard .t{text-align:center;font-weight:800;font-size:24px;margin-bottom:4px}.qcard .sig{text-align:right}
.spk.inl{display:inline-flex;width:40px;height:40px;font-size:18px;vertical-align:middle;margin:0 0 0 6px}
.chunks{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:12px}.chunks.sq{display:grid;grid-template-columns:repeat(2,1fr)}
.chunk{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;font-family:var(--hz);font-size:22px;font-weight:700}.chunk.used{visibility:hidden}
.chunks.sq .chunk{display:flex;align-items:center;gap:8px;font-size:18px}.chunk .oe{font-size:32px}
.built{min-height:56px;border:2px dashed var(--line);border-radius:14px;padding:10px;margin-top:10px;font-family:var(--hz);font-size:24px;font-weight:700}
.built.sq{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;font-size:16px}.sqc{background:var(--soft);border-radius:10px;padding:4px 10px}.sqc b{color:var(--accent);margin-right:4px}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* armory */
.arm{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px;background:var(--soft)}
.arm .ic{font-size:30px;width:44px;text-align:center}
.arm b{font:700 17px var(--serif)}.arm .f{font-size:13px;color:var(--mute);line-height:1.45}
.arm .buy{margin-left:auto;white-space:nowrap;min-width:84px}
.arm.own{border-color:var(--jade);background:rgba(44,117,96,.1)}
.arm.lock{opacity:.6}
.atk{display:flex;align-items:center;gap:10px;background:var(--slate);color:#ecd9a8;border-radius:12px;padding:12px 14px}
.atk b{font:800 30px/1 var(--serif);color:#fff}
.kit{display:flex;flex-wrap:wrap;gap:4px;font-size:24px;margin-left:auto}
/* boss */
.bi{display:block}.bi .zh,.bi .en{display:block}.bi .en{font-size:.86em;opacity:.8;line-height:1.35;font-family:var(--sans);font-weight:400;letter-spacing:0}
button .bi .en{opacity:.85}.rules{margin:6px 0 0;padding-left:18px}.rules li{margin:3px 0}
.slots{font-size:13px;color:#ecd9a8;opacity:.8;align-self:center;margin-left:4px}.swap{margin-top:8px;padding:8px;border:1px dashed var(--bronze);border-radius:10px}
#boss .bname{font:700 16px var(--serif);margin-bottom:4px}
.bossbar{margin-top:10px;display:flex;align-items:center;gap:10px;background:var(--slate);color:#ecd9a8;border-radius:12px;padding:8px 12px;margin-bottom:10px}
.bossbar .be{font-size:36px;line-height:1}
.bossbar .hp{height:10px;background:rgba(255,255,255,.15);border-radius:5px;overflow:hidden;margin-top:4px}.bossbar .hp i{display:block;height:100%;background:linear-gradient(90deg,#e06a55,#c08d22);transition:width .3s}
.bossbar.hit{animation:hitme .5s}.bossbar .say{font-size:12.5px;color:#f0b4a6}
@keyframes hitme{0%,100%{transform:none;background:var(--slate)}20%{transform:translateX(-8px);background:#7a2418}60%{transform:translateX(8px)}}
#boss{position:fixed;inset:0;z-index:25;background:radial-gradient(circle at 50% 40%,#3a2a20,#120c09 75%);color:#ecd9a8;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#boss.on{display:flex}
/* battle */
#boss{background:radial-gradient(ellipse at 50% 35%,#3a2418,#0e0806 78%)}
#boss .bt{font:800 24px var(--serif);color:#ffe6a8;text-shadow:0 2px 0 #6a2a10,0 0 18px rgba(255,160,60,.45);margin-bottom:4px}
.arena{position:relative;width:min(660px,calc(100vw - 44px));aspect-ratio:400/250;margin:6px auto;border-radius:16px;overflow:hidden;box-shadow:0 0 0 2px #b07a2c,0 0 0 6px #2a1810,0 0 0 7px #6a4418,0 16px 44px rgba(0,0,0,.7);touch-action:manipulation}
.arena svg{width:100%;height:100%;display:block}.arena canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.arena .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.combo{position:absolute;right:14px;top:10px;font:900 30px/1 var(--serif);color:#ffe08a;text-shadow:0 2px 0 #7a3a10,0 0 14px rgba(255,170,60,.8);pointer-events:none;text-align:right}
.combo small{display:block;font:800 11px var(--sans);letter-spacing:.08em;margin-top:2px}.combo.pop{animation:cpop .22s ease-out}@keyframes cpop{from{transform:scale(1.45)}to{transform:scale(1)}}
.critTxt{position:absolute;left:50%;top:32%;font:900 50px/1 var(--serif);color:#fff2c0;text-shadow:0 3px 0 #b8401a,0 0 22px #ff8a3a;pointer-events:none;animation:crit .9s ease-out forwards;white-space:nowrap}
.critTxt small{display:block;font:900 15px var(--sans);letter-spacing:.3em;text-align:center;margin-top:4px}
@keyframes crit{0%{transform:translate(-50%,-50%) scale(2.3);opacity:0}15%{transform:translate(-50%,-50%) scale(1);opacity:1}70%{opacity:1}100%{transform:translate(-50%,-80%);opacity:0}}
.arena .dmg{position:absolute;font:900 26px var(--serif);color:#fff;text-shadow:0 0 2px #000,0 2px 0 #6a2a10,0 0 10px rgba(255,190,80,.9);pointer-events:none;animation:dfly .85s ease-out forwards}
.arena .dmg.crit{font-size:42px;color:#ffcf6a;text-shadow:0 0 3px #000,0 3px 0 #9a2a0a,0 0 18px #ff6a2a}
@keyframes dfly{0%{transform:translate(-50%,0) scale(.4);opacity:0}18%{transform:translate(-50%,-14px) scale(1.25);opacity:1}100%{transform:translate(-50%,-70px) scale(1);opacity:0}}
.idleH{animation:brH 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes brH{50%{transform:translateY(1.6px)}}
.idleF{animation:brF 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes brF{50%{transform:scale(1.02,1.035)}}
.cape{animation:capeF 1.5s ease-in-out infinite;transform-box:fill-box;transform-origin:100% 0}@keyframes capeF{50%{transform:skewX(-7deg)}}
.plume{animation:plmF 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:0 100%}@keyframes plmF{50%{transform:rotate(-9deg)}}
#boss .bhp{height:14px;border-radius:7px;background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 1px rgba(255,220,160,.3)}
#boss .bhp i{background:linear-gradient(180deg,#ff8a6a,#c0301a 60%,#8a1a0a);box-shadow:0 0 10px rgba(255,90,40,.6)}
#boss.counter{background:radial-gradient(circle at 50% 40%,#4a1410,#120605 75%)}
.hurtflash{position:fixed;inset:0;z-index:24;background:rgba(200,30,20,.35);pointer-events:none;animation:hf .5s ease-out forwards}@keyframes hf{to{opacity:0}}
#boss .bt{font:800 26px var(--serif)}
#boss .bm{font-size:150px;line-height:1.1;margin:10px 0;border:none;background:none;padding:0;transition:transform .06s}
#boss .bm.hurt{transform:scale(.9) rotate(-4deg)}
#boss .bhp{width:min(420px,90vw);height:16px;background:rgba(255,255,255,.12);border-radius:8px;overflow:hidden}#boss .bhp i{display:block;height:100%;background:linear-gradient(90deg,#e06a55,#c08d22);transition:width .15s}
#boss .cd{font:800 40px var(--serif);color:#fff;margin-top:10px;font-variant-numeric:tabular-nums}
.dmg{position:fixed;z-index:26;font:800 28px var(--serif);color:#ffd36b;pointer-events:none;text-shadow:0 2px 6px #000;animation:fly .8s ease-out forwards}
.dmg.crit{font-size:44px;color:#ff7a5c}
@keyframes fly{from{transform:translate(-50%,0) scale(1);opacity:1}to{transform:translate(-50%,-90px) scale(1.3);opacity:0}}


.isl .nm{display:inline-block;margin-top:10px;font-size:13px;font-weight:800;background:var(--card);border-radius:99px;padding:2px 10px;box-shadow:0 1px 3px #0002}
.isl .st{font-size:12px;margin-top:3px;letter-spacing:1px}
.isl .st b{color:var(--gold)}
.panda{position:absolute;font-size:40px;animation:bob 1.6s ease-in-out infinite;pointer-events:none;z-index:2}
.deco{position:absolute;font-size:26px;opacity:.85;pointer-events:none}
.wave{position:absolute;font-size:18px;opacity:.5;animation:drift 6s ease-in-out infinite;pointer-events:none}
@keyframes ring{from{transform:scale(.9);opacity:1}to{transform:scale(1.35);opacity:0}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-8px) rotate(4deg)}}
@keyframes drift{0%,100%{transform:translateX(0)}50%{transform:translateX(14px)}}
/* levels */
.lvl{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:var(--soft);margin-top:10px}
.lvl .ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:26px;background:var(--card);flex:none}
.lvl .tx{flex:1;min-width:0}
.lvl .tx b{display:block}
.lvl .tx span{font-size:12px;color:var(--muted)}
.stars3{font-size:18px;letter-spacing:2px;white-space:nowrap}
.stars3 .off{filter:grayscale(1);opacity:.25}
.lvl .go{padding:10px 16px;border-radius:12px;background:var(--accent);color:#fff;font-weight:700;flex:none}

.cmp.side{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
.grid-rv{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;margin-top:12px}

/* mole game */
.field{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 10px;max-width:440px;margin:12px auto 0;padding:14px 12px 6px;border-radius:24px;background:radial-gradient(circle at 30% 20%,var(--grass),var(--grass2))}
.hole{position:relative;height:118px;overflow:hidden}

@keyframes squash{0%{transform:scale(1)}40%{transform:scale(1.25,.6)}100%{transform:scale(1,.4);bottom:-110px}}

.flip{width:220px;height:260px;margin:10px auto;perspective:900px;cursor:pointer}

.vert .slot{min-width:3.2em}
.fix{text-align:center;min-height:52px;margin-top:6px}
.fix b{color:var(--ok);font-size:24px}
.combo2{text-align:center;font-weight:800;color:var(--accent);min-height:22px;font-size:15px}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:360px;margin:8px auto 0}
.kp button{height:62px;border-radius:16px;background:var(--card);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
.kp button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.kp .ok{background:var(--ok);color:#fff;border-color:transparent;box-shadow:0 4px 0 #2d7543}
.kp .del{font-size:24px;color:var(--muted)}
.kp .ok.dim{opacity:.45}
.kp.cmp button.sel{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.kp.cmp button{height:86px;font-size:46px}
.mbar{position:relative;flex:1;height:12px;border-radius:99px;background:var(--line);margin:0 4px 0 16px}
.mbar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,var(--gold),var(--accent));transition:width .3s}
.mbar b{position:absolute;top:-15px;font-size:24px;margin-left:-14px;transition:left .3s;line-height:1}
.mbar.late i{background:var(--bad)}
.lanes{margin-top:4px}
.lane{position:relative;height:38px;border-radius:12px;background:var(--soft);margin-top:6px;overflow:hidden}
.lane span{position:absolute;top:5px;font-size:24px;transition:left .3s;margin-left:-14px;line-height:1.1}
.lane .fl{right:8px;left:auto!important;margin:0;font-size:20px;top:8px}
.lane small{position:absolute;left:8px;top:10px;font-size:11px;color:var(--muted);width:46px}
.mtitle{text-align:center;font-size:13px;color:var(--muted);font-weight:600}
.errbar{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:14px}
.errbar span{flex:none;width:9.5em}
.errbar i{display:block;height:12px;border-radius:9px;background:var(--bad);opacity:.75}
.errbar em{font-style:normal;color:var(--muted);font-size:12px;flex:none}
.tip{font-size:12px;color:var(--muted);margin:2px 0 0 9.5em;padding-left:8px}
.days14{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:8px}
.days14 span{text-align:center;font-size:10px;color:var(--muted)}
.days14 span b{display:grid;place-items:center;height:30px;border-radius:8px;background:var(--soft);font-size:13px;margin-bottom:1px}
.days14 span.y b{background:var(--ok-soft);color:var(--ok)}
.days14 span.h b{background:var(--ok);color:#fff}

  return new Set(g.filter(x=>x[1]).map(x=>x[0])).size>=2?'ok':'mid'}

function reviewPick(lessons,k){const pool=Object.keys(CH).filter(c=>lessons.includes(CH[c].n));if(!pool.length)return[];
  const rank={bad:0,mid:1,new:2,ok:3};
  return shuffle(pool).sort((a,b)=>rank[status(a)]-rank[status(b)]||lastSeen(a).localeCompare(lastSeen(b))).slice(0,k||pool.length)}

function tone(f,t,d,type='sine',v=.18){if(!AC||!S.sfx)return;const o=AC.createOscillator(),g=AC.createGain(),t0=AC.currentTime+t;
  o.type=type;o.frequency.setValueAtTime(f,t0);g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(v,t0+.01);g.gain.exponentialRampToValueAtTime(.001,t0+d);
  o.connect(g).connect(AC.destination);o.start(t0);o.stop(t0+d+.02)}
const SFX={ok:()=>{tone(880,0,.12);tone(1320,.09,.2)},no:()=>{tone(260,0,.16,'triangle',.14);tone(200,.12,.2,'triangle',.12)},

  whack:()=>{tone(140,0,.09,'square',.22);tone(90,.03,.12,'triangle',.2)},

function flyStars(k,from){const tgt=$('#sStar');if(!tgt)return;const el=from&&from.getBoundingClientRect?from:null;
  const a=el?el.getBoundingClientRect():{left:innerWidth/2,top:innerHeight/2,width:0,height:0},b=tgt.getBoundingClientRect();
  for(let i=0;i<Math.min(k,6);i++){const s=document.createElement('span');s.className='fly';s.textContent='⭐';
    const x0=a.left+a.width/2-15+(Math.random()*30-15),y0=a.top+a.height/2-15;s.style.left=x0+'px';s.style.top=y0+'px';document.body.appendChild(s);
    const dx=b.left+12-x0,dy=b.top+2-y0;
    if(!s.animate){s.remove();continue}
    const an=s.animate([{transform:'translate(0,0) scale(1.4)'},{transform:`translate(${dx*.3}px,${dy*.3-60}px) scale(1.2)`,offset:.35},{transform:`translate(${dx}px,${dy}px) scale(.6)`}],
      {duration:750,delay:i*90,easing:'cubic-bezier(.5,0,.6,1)',fill:'forwards'});
    an.onfinish=()=>{s.remove();tgt.classList.remove('bump');void tgt.offsetWidth;tgt.classList.add('bump');sfx('coin')}}}
function confetti(n=70){const c=document.createElement('div');c.className='confetti';const cols=['#e0703a','#e8a417','#3f9a5b','#4a90d9','#d9488f','#8e6bd8'];
  for(let i=0;i<n;i++){const p=document.createElement('i');p.style.left=Math.random()*100+'%';p.style.background=cols[i%cols.length];
    p.style.animationDuration=(1.6+Math.random()*1.6)+'s';p.style.animationDelay=Math.random()*.5+'s';p.style.transform=`rotate(${Math.random()*360}deg)`;c.appendChild(p)}
  document.body.appendChild(c);setTimeout(()=>c.remove(),3800)}

const TYPES={
  pick:{name:'听音找字',tip:'听读音，点出对的字',tag:'自动',min:3,k:8},
  pyc:{name:'看拼音找字',tip:'不用听，看拼音和提示选字',tag:'自动',min:3,k:8},
  fill:{name:'课文填空',tip:'课文里的句子缺一个字',tag:'自动',min:3,k:6},
  poly:{name:'多音字',tip:'同一个字在这里读什么',tag:'自动',min:2,k:6},
  read:{name:'看字读一读',tip:'大声读，家长判对错',tag:'家长听',min:2,k:10},
  dict:{name:'听写',tip:'听读音，在格子里写出这个字',tag:'手写',min:4,k:6},
  pyw:{name:'看拼音写字',tip:'看拼音和提示，在格子里写字',tag:'手写',min:4,k:6},
  say:{name:'组词说句子',tip:'用字组词，再说一句话',tag:'家长听',min:2,k:3},
};
const TNAME={...Object.fromEntries(Object.entries(TYPES).map(([k,v])=>[k,v.name])),mole:'打地鼠'};
const ORDER=Object.keys(TYPES);
function polyItems(chars){const set=chars?new Set(chars):null,out=[];
  D.poly.forEach(([c,ctxs])=>{if(!CH[c]||(set&&!set.has(c)))return;const reads=[...new Set(ctxs.map(x=>x[1]))];
    ctxs.forEach(([ctx,py,n])=>{if(n<=Math.max(curLesson(),CH[c].n))out.push({c,ctx,py,reads})})});return out}
function distractors(c,k){const py=CH[c].py,top=Math.max(curLesson(),CH[c].n);
  const near=shuffle(Object.keys(CH).filter(x=>x!==c&&CH[x].py!==py&&CH[x].n===CH[c].n));
  const far=shuffle(Object.keys(CH).filter(x=>x!==c&&CH[x].py!==py&&CH[x].n!==CH[c].n&&CH[x].n<=top));
  return[...near,...far].slice(0,k)}
function ctxFor(c){const l=L[CH[c].n],lines=[...l.text,l.sent,l.t].filter(Boolean);
  let cl=lines.flatMap(s=>s.replace(/[“”]/g,'').split(/[，。！？：；…]/)).map(s=>s.trim()).filter(s=>s.includes(c)&&s.length>=4);
  if(!cl.length)cl=lines.map(s=>s.replace(/[“”]/g,'').replace(/[。！，]+$/,'')).filter(s=>s.includes(c));
  cl.sort((a,b)=>Math.abs(a.length-8)-Math.abs(b.length-8));return cl[0]||CH[c].h}
function mkItems(type,chars){
  if(type==='poly')return shuffle(polyItems(chars.length?chars:null)).slice(0,TYPES.poly.k).map(q=>({...q,opts:shuffle(q.reads)}));
  return chars.map(c=>{const it={c};
    if(type==='pick'||type==='pyc')it.opts=shuffle([c,...distractors(c,3)]);
    if(type==='fill'){it.s=ctxFor(c);it.opts=shuffle([c,...distractors(c,8).filter(x=>!it.s.includes(x)).slice(0,2)])}
    return it})}
function pickItems(pool,k,n){const own=shuffle(pool.filter(c=>CH[c].n===n)),oth=shuffle(pool.filter(c=>CH[c].n!==n));
  if(!own.length||!oth.length)return shuffle(pool).slice(0,k);
  const ko=Math.min(oth.length,Math.max(1,Math.round(k*oth.length/pool.length)));
  return shuffle([...own.slice(0,k-ko),...oth.slice(0,ko)])}
function examSteps(n){const cs=shuffle(L[n].chars.map(x=>x[0])),pc=new Set(polyItems(cs).map(p=>p.c)),g={},base=['pick','pyc','fill'];let polyUsed=0;
  const wr=new Set(cs.filter(c=>!pc.has(c)).slice(0,3));/* 每次通关考试有 3 个字要写（听写） */
  cs.forEach((c,i)=>{let t=wr.has(c)?'dict':base[i%3];if(pc.has(c)&&polyUsed<2){t='poly';polyUsed++}(g[t]=g[t]||[]).push(c)});
  return ORDER.filter(t=>g[t]).map(t=>({type:t,items:t==='poly'?g.poly.map(c=>{const q=shuffle(polyItems([c]))[0];return{...q,opts:shuffle(q.reads)}}):mkItems(t,g[t])}))}

/* ---------- runner ---------- */
let clk;
function go(kind){const n=view.n,l=L[n];
  if(kind.startsWith('learn')){const p=kind.split(':')[1],all=[{type:'chars',items:l.chars.map(x=>({c:x[0]}))},{type:'words'},{type:'text'}];
    return startRun('learn',p!=null?[all[+p]]:all,n)}
  if(kind==='read')return startRun('read',[{type:'reading'}],n);
  if(kind==='exam')return startRun('exam',[{type:'armory',n},...examSteps(n)],n);
  if(kind==='practice'){const pool=learnPool(),sel=S.types.filter(t=>t!=='poly'||polyItems(pool).length).sort((a,b)=>ORDER.indexOf(a)-ORDER.indexOf(b));
    startRun('practice',sel.map(t=>({type:t,items:mkItems(t,t==='poly'?pool:pickItems(pool,TYPES[t].k,n))})).filter(s=>s.items.length),n)}
}
function dayBonus(sub){const t=today(),arr=sub==='m'?S.m.days:sub==='r'?S.rd.days:(S.zhDays=S.zhDays||[]);if(!arr.includes(t)){arr.push(t);if(arr.length>500)arr.splice(0,arr.length-500)}
  if(touchDay()){addStars(2,$('#sStar'));toast('今天第一次来学习 +2⭐')}}
function startRun(kind,steps,n){
  stopSpeak();if(!steps.length)return toast('没有可以出的题');
  steps.forEach(s=>{s.ans=[];s.pos=0;if(s.type==='dict')s.wrong=new Set()});
  view.run={kind,n,steps,si:0,t0:Date.now(),stars:0,log:[]};if(kind==='exam')steps.forEach(s=>{if(isQ(s.type))s.bossQ=true});if(steps.some(s=>s.type==='armory'))bossSetup(view.run);
  dayBonus();save();render();
  clearInterval(clk);clk=setInterval(()=>{const c=$('#clock');if(c&&view.run)c.textContent=fmt(((Date.now()-view.run.t0)/1000)|0)},1000);
}
const isQ=t=>!!TYPES[t]||!!(typeof QT!=='undefined'&&QT[t]);
const qCount=r=>r.steps.filter(s=>isQ(s.type)).reduce((a,s)=>a+s.items.length,0);
const aCount=r=>r.steps.filter(s=>isQ(s.type)).reduce((a,s)=>a+s.ans.filter(Boolean).length,0);
function answer(s,i,ok){if(s.ans[i])return;const it=s.items[i],r=view.run;s.ans[i]={ok};rec(it.c,ok,s.type);if(it.id)recQ(it.id,ok);r.log.push({c:it.c||it.id,ok,type:s.type,part:s.part});
  if(r.boss&&s.bossQ&&S.boss[r.boss.n].hp>0&&!view.tapping){if(!ok)view.afterTap=()=>{const bb=$('.bossbar');if(bb)bb.outerHTML=bossBar()};bossAnswer(ok)}
  if(ok){sfx('ok');if(r.kind==='retest'){addStars(2);S.cleared.push([it.c,today()])}else addStars(1);
    if(s.type==='poly')inc('poly');if(s.type==='say')inc('say')}
  else{sfx('no');shake(lastTap)}
  save()}
function stepDone(s){return isQ(s.type)?s.ans.filter(Boolean).length===s.items.length:!!s.fin}
function goStep(si,pos){stopSpeak();const r=view.run;r.si=si;if(pos!=null)r.steps[si].pos=pos;renderRun()}
function advance(){if(view.tapping){view.afterTap=advance;return}const r=view.run;if(!r)return;const s=r.steps[r.si];stopSpeak();
  const len=s.type==='dict'&&S.paper?s.items.length+1:(s.items||[0]).length;
  if(s.items&&s.pos<len-1){s.pos++;return renderRun()}
  if(!isQ(s.type))s.fin=true;
  if(r.si<r.steps.length-1){r.si++;const t=r.steps[r.si];if(isQ(t.type)){const u=t.items.findIndex((_,i)=>!t.ans[i]);t.pos=u<0?0:u}return renderRun()}
  tryFinish()}
function tryFinish(){const r=view.run,left=qCount(r)-aCount(r);if(left>0&&!r.confirm){r.confirm=true;return renderRun()}finish()}
function quit(){stopSpeak();clearInterval(clk);save();view.run=null;render()}

function renderRun(){
  const r=view.run;if(r.done)return renderDone();
  const s=r.steps[r.si],M=$('#main');
  const names={chars:'跟读生字',words:'跟读词语',text:'读课文',reading:'阅读',armory:'⚔️ 出征'},tname=t=>names[t]||QT[t]||TYPES[t].name;
  const tq=qCount(r),pct=tq?aCount(r)/tq*100:(r.si+(s.items?s.pos/s.items.length:0))/r.steps.length*100;

    ${r.kind==='go'?`<div class="partnav">${['W','A','B','C','X'].filter(p=>r.steps.some(x=>x.part===p)).map(p=>{const cur=s.part===p,dn=r.steps.filter(x=>x.part===p).every(stepDone);return`<span class="${cur?'on':''} ${dn&&!cur?'fin':''}">${dn&&!cur?'✓':PART[p][0]} ${PART[p][1]}</span>`}).join('<i>›</i>')}</div>`

  const card=b=>{M.innerHTML=`<section class="card">${top}${r.boss&&s.bossQ?bossBar():''}${b}</section>`;$('#quit').onclick=quit;if($('#fin'))$('#fin').onclick=()=>{r.confirm=false;tryFinish()};
    $$('[data-si]').forEach(b=>b.onclick=()=>goStep(+b.dataset.si));window.scrollTo(0,0)};

    bindNav();return}
  if(s.type==='dict'){const n=s.items.length;
    if(s.pos<n){const c=it.c;
      card(`${lab(`听写 · ${s.pos+1}/${n} · 📝 拿出纸和笔，听一个写一个${kindTag}`)}<div class="stage"><div class="dn" style="margin-top:8px">${s.pos+1}</div>

/* ---------- 手写格（和哥哥的一样）：手指或 Apple Pencil 写；笔画存成 0–1 坐标，看答案时重画 ---------- */
function padSize(k){const m=$('#main'),W=Math.min((m?m.clientWidth:360)-60,560);return Math.max(110,Math.min(k===2?200:300,k===2?Math.floor((W-14)/2):W))}
function drawStrokes(cv,list){const s=cv._s,d=window.devicePixelRatio||1,g=cv.getContext('2d');g.setTransform(d,0,0,d,0,0);g.clearRect(0,0,s,s);
  g.lineCap='round';g.lineJoin='round';g.strokeStyle='#1f1a14';g.lineWidth=Math.max(4,s*.05);
  list.forEach(p=>{if(!p.length)return;g.beginPath();g.moveTo(p[0][0]*s,p[0][1]*s);
    if(p.length===1){g.lineTo(p[0][0]*s+.1,p[0][1]*s+.1)}else{for(let i=1;i<p.length-1;i++){const mx=(p[i][0]+p[i+1][0])/2*s,my=(p[i][1]+p[i+1][1])/2*s;g.quadraticCurveTo(p[i][0]*s,p[i][1]*s,mx,my)}const q=p[p.length-1];g.lineTo(q[0]*s,q[1]*s)}g.stroke()})}
function drawPads(it){$$('.pad canvas').forEach(cv=>drawStrokes(cv,it.st[+cv.dataset.i]||[]))}
function bindPads(it,live,onChange,k){const s=padSize(k||1),d=window.devicePixelRatio||1;$$('.pads').forEach(p=>p.style.setProperty('--ps',s+'px'));
  const cvs=$$('.pad canvas');cvs.forEach(cv=>{cv._s=s;cv.width=s*d;cv.height=s*d;cv.style.width=cv.style.height=s+'px';drawStrokes(cv,it.st[+cv.dataset.i]||[])});
  if(!live)return;const ready=Date.now()+350;
  cvs.forEach(cv=>{const i=+cv.dataset.i;let cur=null;
    const pt=e=>{const r=cv.getBoundingClientRect();return[Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),Math.min(1,Math.max(0,(e.clientY-r.top)/r.height))]};
    cv.onpointerdown=e=>{if(Date.now()<ready)return;if(e.pointerType==='pen')it.pen=true;else if(it.pen&&e.pointerType==='touch')return;/* 用笔写时不理手掌 */
      e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(_){}cur=[pt(e)];it.st[i].push(cur);drawStrokes(cv,it.st[i])};
    cv.onpointermove=e=>{if(!cur)return;e.preventDefault();(e.getCoalescedEvents?e.getCoalescedEvents():[e]).forEach(x=>cur.push(pt(x)));drawStrokes(cv,it.st[i])};
    cv.onpointerup=cv.onpointercancel=()=>{if(!cur)return;cur=null;onChange&&onChange()}})}
function tokens(line,li){return[...line].map((ch,j)=>/[一-鿿]/.test(ch)?`<span data-j="${j}" data-li="${li}">${ch}</span>`:ch).join('')}
function tapWord(sp,lines){stopSpeak();const li=+sp.dataset.li,j=+sp.dataset.j,line=lines[li],ch=line[j],l=L[view.run.n];
  let w=null,k=j,p='';$$('.ln').forEach(x=>x.classList.remove('on'));
  const all=[...(l.words||[]),...D.lessons.filter(x=>x!==l).flatMap(x=>x.words||[])];
  for(const[ww,pp]of all.sort((a,b)=>b[0].length-a[0].length)){let x=line.indexOf(ww);while(x>=0){if(x<=j&&j<x+ww.length){w=ww;k=x;p=pp;break}x=line.indexOf(ww,x+1)}if(w)break}
  if(!w){w=ch;p=CH[ch]?CH[ch].py:'';if('的了着吗呢吧么啦呀'.includes(ch)&&j>0&&/[一-鿿]/.test(line[j-1])){w=line[j-1]+ch;k=j-1;p=''}}
  $$('.tx span').forEach(x=>x.classList.toggle('hl',+x.dataset.li===li&&+x.dataset.j>=k&&+x.dataset.j<k+w.length));
  $('#wp').innerHTML=`<div class="wordpop"><b>${esc(w)}</b><span class="p">${esc(p)}</span><button id="wps" aria-label="再听">🔊</button></div>`;
  const say=()=>speak(w);$('#wps').onclick=say;say()}

/* ---------- after any session: levels, sticker, badges ---------- */
function afterSession(kind,n,g,extra){
  const res={draw:false};
  if(kind==='practice'&&g.length>=6)S.best2[n]=Math.max(S.best2[n]||0,accStars(g.filter(x=>x.ok).length/g.length));
  if(kind==='exam'&&g.length){const k=accStars(g.filter(x=>x.ok).length/g.length);S.best3[n]=Math.max(S.best3[n]||0,k);
    if(k===3&&!S.examBonus[n]){S.examBonus[n]=today();S.draws++;res.draw=true;res.examBonus=true}}
  const meaningful=g.length>=5||kind==='learn'||kind==='read'||(extra&&extra.rounds>=5);
  if(meaningful&&S.drawDay!==today()){S.drawDay=today();S.draws++;res.draw=true}
  save();res.badges=checkBadges();return res}
function finish(){
  const r=view.run;r.done=true;r.confirm=false;clearInterval(clk);stopSpeak();r.secs=((Date.now()-r.t0)/1000)|0;const g=r.log;
  if(r.kind==='learn'&&r.steps.some(s=>s.type==='chars'&&s.fin)&&r.steps.some(s=>s.type==='text'&&s.fin))S.learnDone[r.n]=today();
  if(r.kind==='go')goFinish(r);

  if(g.length||r.kind==='learn'||r.kind==='read')S.sessions.unshift({d:today(),n:r.n,kind:r.kind,types:r.steps.map(s=>s.type),items:g.length,ok:g.filter(x=>x.ok).length,secs:r.secs,stars:r.stars});
  S.sessions=S.sessions.slice(0,200);r.after=afterSession(r.kind,r.n,g);renderDone();
  const okRate=g.length?g.filter(x=>x.ok).length/g.length:1;if(okRate>=.8){confetti();sfx('fan')}
  setTimeout(()=>showBadges(r.after.badges),900);
}

function startGame(mode,pool,n,from){

  view.game={mode,pool,n,from:from||'lesson',score:0,round:0,combo:0,maxCombo:0,stars:0,log:[],
    total:mode==='practice'?Math.min(10,Math.max(6,pool.length)):Infinity,t0:Date.now(),left:60,phase:'ready',seen:{},rid:0};

function renderGame(){
  const G=view.game,M=$('#main');

      <div class="gamebar" style="flex:1"><span>${G.mode==='practice'?`🐢 第 <span id="gr">${Math.min(G.round+1,G.total)}</span>/${G.total} 只`:`⏱️ <span id="gt">${G.left}</span> 秒`}</span><span class="sc">🔨 <span id="gs">${G.score}</span></span></div></div>

    ${G.phase==='ready'?`<button class="big-btn" id="gstart">${G.mode==='practice'?'开始！':'开始挑战 60 秒！'}</button>`:''}
  </section>`;
  $('#gq').onclick=()=>endGame(true);
  $('#gspk').onclick=()=>{if(G.target)speak(sayChar(G.target))};
  $$('.mole').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();whack(b,e)}));
  if($('#gstart'))$('#gstart').onclick=()=>{G.phase='play';$('#gstart').remove();$('#gmsg').textContent='听一听，敲出对的字！';
    if(G.mode==='challenge'){G.tEnd=Date.now()+60000;G.tick=setInterval(()=>{G.left=Math.max(0,Math.ceil((G.tEnd-Date.now())/1000));const t=$('#gt');if(t)t.textContent=G.left;
      if(G.left<=5&&G.left>0)sfx('tick');if(G.left<=0)endGame()},250)}
    nextRound()};
}
function pickTarget(G){const rank={bad:0,new:1,mid:2,ok:3};return shuffle(G.pool).sort((a,b)=>(G.seen[a]||0)-(G.seen[b]||0)||rank[status(a)]-rank[status(b)])[0]}
async function nextRound(){const G=view.game;if(!G||G.phase!=='play')return;
  if(G.round>=G.total)return endGame();
  clearTimeout(G.hideT);$$('.mole').forEach(m=>{m.classList.remove('up','hit','bad');m.dataset.c=''});
  const gr=$('#gr');if(gr)gr.textContent=Math.min(G.round+1,G.total);
  await sleep(380);if(view.game!==G||G.phase!=='play')return;
  const c=pickTarget(G);G.target=c;G.seen[c]=(G.seen[c]||0)+1;G.tried=false;const rid=++G.rid;
  const k=G.mode==='practice'?2:3,opts=shuffle([c,...distractors(c,k)]),holes=shuffle([...Array(9).keys()]).slice(0,opts.length);
  speak(sayChar(c));
  opts.forEach((x,i)=>{const m=$$('.mole')[holes[i]];m.dataset.c=x;m.querySelector('b').textContent=x;setTimeout(()=>{if(G.rid===rid){m.classList.add('up');sfx('pop')}},200+i*180)});
  if(G.mode==='challenge')G.hideT=setTimeout(()=>{if(G.rid!==rid||view.game!==G)return;G.combo=0;G.round++;$('#gcombo').textContent='跑掉啦～';nextRound()},4200);
}
function whack(m,e){const G=view.game;if(!G||G.phase!=='play'||!m.classList.contains('up')||!m.dataset.c)return;
  const h=document.createElement('span');h.className='hammer';h.textContent='🔨';h.style.left=(e.clientX-30)+'px';h.style.top=(e.clientY-45)+'px';document.body.appendChild(h);setTimeout(()=>h.remove(),400);
  if(m.dataset.c===G.target){clearTimeout(G.hideT);m.classList.add('hit');sfx('whack');G.score++;const s=$('#gs');if(s){s.textContent=G.score;s.parentNode.classList.remove('bump');void s.offsetWidth;s.parentNode.classList.add('bump')}
    if(!G.tried){rec(G.target,true,'mole');G.log.push({c:G.target,ok:true});G.combo++;G.maxCombo=Math.max(G.maxCombo,G.combo);addStars(1,m);
      $('#gcombo').textContent=G.combo>=3?`🔥 连击 ×${G.combo}！`:'打中了！'}else $('#gcombo').textContent='打中了！';
    G.rid++;$$('.mole').forEach(x=>{if(x!==m)x.classList.remove('up')});G.round++;save();setTimeout(nextRound,500)}
  else{m.classList.add('bad');sfx('no');setTimeout(()=>{m.classList.remove('up');m.dataset.c=''},380);
    if(!G.tried){G.tried=true;rec(G.target,false,'mole');G.log.push({c:G.target,ok:false});save()}G.combo=0;$('#gcombo').textContent='不是这只，再听一遍～';
    setTimeout(()=>{if(view.game===G)speak(sayChar(G.target))},300)}}
function endGame(quitting){const G=view.game;if(!G||G.phase==='end')return;clearInterval(G.tick);clearTimeout(G.hideT);stopSpeak();G.rid++;
  if(quitting&&G.round===0&&!G.log.length){view.game=null;return render()}
  G.phase='end';G.secs=((Date.now()-G.t0)/1000)|0;
  if(G.mode==='challenge'&&G.from==='lesson'){G.best=S.moleBest[G.n]||0;if(G.score>G.best)S.moleBest[G.n]=G.score}
  if(G.log.length)S.sessions.unshift({d:today(),n:G.n,kind:'mole',types:['mole'],items:G.log.length,ok:G.log.filter(x=>x.ok).length,secs:G.secs,stars:G.stars});
  G.after=afterSession('mole',G.n,G.log,{rounds:G.round});renderGameEnd();
  if(G.score>=5){confetti();sfx('fan')}setTimeout(()=>showBadges(G.after.badges),900)}
function renderGameEnd(){const G=view.game,wr=[...new Set(G.log.filter(x=>!x.ok).map(x=>x.c))];paintScore();

const FX={c:null,ctx:null,ps:[],raf:0,k:1,

  sparks(x,y,n,cols,sp=4){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=sp*(.4+Math.random());this.add({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1,g:.18,max:18+Math.random()*16,size:1+Math.random()*2.2,color:cols[i%cols.length],shape:'l'})}},

/* 轮换：没做过的先出，其次是上次错的，最后是最久没做的 */
function rot(list,k,used){const Q=S.qs;const r=x=>{const q=Q[x.id];return!q?0:!q.o?1:2};
  return shuffle(list.filter(x=>!used.has(x.id))).sort((a,b)=>r(a)-r(b)||String((Q[a.id]||{}).d||'').localeCompare(String((Q[b.id]||{}).d||''))).slice(0,k).map(x=>(used.add(x.id),x))}

  return shuffle(cs).sort((a,b)=>rk[status(a)]-rk[status(b)]||ls(a).localeCompare(ls(b)))}
/* 题库：一课的「听懂」「读懂会用」题；没写题的课用课本自动出 */
function bank(n){const l=L[n],ex=l.ex,id=(t,x,j)=>`q:${n}:${t}:${x}${j!=null?'-'+j:''}`;
  if(ex){const B={lpic:[],dlg:[],rej:[]},C={card:[],use:[],order:[],seq:[]};
    (ex.lpic||[]).forEach(x=>B.lpic.push({...x,id:id('p',x.id),type:'lpic'}));
    (ex.dlg||[]).forEach(x=>B.dlg.push({...x,id:id('d',x.id),type:'dlg'}));
    (ex.rej||[]).forEach(x=>B.rej.push({...x,id:id('r',x.id),type:'rej'}));
    (ex.card||[]).forEach(x=>x.qs.forEach((q,j)=>C.card.push({...q,card:x.card,id:id('c',x.id,j),type:'card'})));
    (ex.use||[]).forEach(x=>C.use.push({...x,id:id('u',x.id),type:'use'}));
    (ex.order||[]).forEach(x=>C.order.push({...x,id:id('o',x.id),type:'order'}));
    (ex.seq||[]).forEach(x=>C.seq.push({...x,id:id('s',x.id),type:'seq'}));
    return{B,C,own:true}}
  const ws=l.words||[],others=D.lessons.flatMap(x=>x.words||[]).filter(w=>!ws.some(v=>v[0]===w[0]));
  const lw=ws.map(([w,py])=>({id:id('w',w),type:'lw',w,py,a:w,o:shuffle([...ws.filter(v=>v[0]!==w),...others].map(v=>v[0])).slice(0,3)}));
  const order=[];if(l.sent){const ch=chunk(l.sent.replace(/[。！？，]$/,''),ws.map(v=>v[0]));if(ch.length>=3)order.push({id:id('o','sent'),type:'order',pic:'📘',c:ch,ok:[ch.join('')]})}
  return{B:{lw},C:{order},own:false}}
function chunk(s,words){const out=[];let i=0;while(i<s.length){const w=words.filter(x=>s.startsWith(x,i)).sort((a,b)=>b.length-a.length)[0];const len=w?w.length:Math.min(2,s.length-i);out.push(s.slice(i,i+len));i+=len}
  while(out.length>5){let k=0;for(let j=1;j<out.length-1;j++)if(out[j].length+out[j+1].length<out[k].length+out[k+1].length)k=j;out.splice(k,2,out[k]+out[k+1])}return out}
function prepQ(x){const it={...x};if(x.o)it.opts=shuffle([x.a,...x.o]);if(x.type==='order'||x.type==='seq'){it.sh=shuffle(x.c.map((_,i)=>i));it.picked=[];if(it.sh.join()===x.c.map((_,i)=>i).join())it.sh.reverse()}return it}
const stp=(type,items,part,bossQ)=>items.length?{type,items,part,bossQ:!!bossQ}:null;
function goSteps(n){const l=L[n],cs=weakChars(l.chars.map(x=>x[0])),used=new Set(),B=bank(n),visit=(S.ab[n]&&S.ab[n].v)||0;
  const own=cs.slice(0,6),wr=wrongList().filter(c=>CH[c].n!==n).slice(0,2);
  const A=[stp('pick',mkItems('pick',[...wr,...own.slice(0,2)]),'A'),stp('pyc',mkItems('pyc',own.slice(2,4)),'A'),stp('dict',mkItems('dict',[own[4]||own[0]]),'A'),stp('pyw',mkItems('pyw',[own[5]||own[1]]),'A')];
  let Bs,Cs,bossB,bossC;
  if(B.own){const p=rot(B.B.lpic,2,used),d=rot(B.B.dlg,1,used),r=rot(B.B.rej,1,used);Bs=[stp('lpic',p.map(prepQ),'B'),stp('dlg',d.map(prepQ),'B'),stp('rej',r.map(prepQ),'B')];
    const c=rot(B.C.card,1,used),u=rot(B.C.use,2,used),o=visit%2?rot(B.C.seq,1,used):rot(B.C.order,1,used);
    Cs=[stp('card',c.map(prepQ),'C'),stp('use',u.map(prepQ),'C'),stp(o[0]?o[0].type:'order',o.map(prepQ),'C')];
    const bp=rot([...B.B.lpic,...B.B.dlg],1,used),bc=rot([...B.C.card,...B.C.use],1,used);bossB=bp.map(prepQ);bossC=bc.map(prepQ)}
  else{const w=rot(B.B.lw,4,used),fc=weakChars(cs.filter(c=>ctxFor(c)!==CH[c].h)).slice(0,3),o=rot(B.C.order,1,used);
    Bs=[stp('lw',w.slice(0,3).map(prepQ),'B')];Cs=[stp('fill',mkItems('fill',fc.slice(0,2)),'C'),stp('order',o.map(prepQ),'C')];
    bossB=w.slice(3).map(prepQ);bossC=fc[2]?mkItems('fill',[fc[2]]):[]}
  const rest=cs.slice(6).concat(cs.slice(0,6)),bw=rest[0],bk=rest[1]||cs[0];
  const X=[{type:'armory',n,part:'X'},stp('dict',mkItems('dict',[bw]),'X',1),stp('pick',mkItems('pick',[bk]),'X',1),
    ...bossB.map(it=>stp(it.type,[it],'X',1)),...bossC.map(it=>stp(it.type||'fill',[it],'X',1))];
  const W=S.went[n]?[]:[{type:'chars',items:l.chars.map(x=>({c:x[0]})),part:'W'}];
  return[...W,...A,...Bs,...Cs,...X].filter(Boolean)}

/* ====================== 数学：口算速度 + 准确率 ====================== */
const RI=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.random()*a.length|0];
const dg=(n,i)=>Math.floor(n/10**i)%10;
const carries=(a,b)=>{let c=0,n=0;for(let i=0;i<4;i++){c=dg(a,i)+dg(b,i)+c>=10?1:0;n+=c}return n};
const borrows=(a,b)=>{let c=0,n=0;for(let i=0;i<4;i++){c=dg(a,i)-dg(b,i)-c<0?1:0;n+=c}return n};
const until=(f,ok)=>{for(let i=0;i<500;i++){const r=f();if(ok(r))return r}throw new Error('gen')};
const PL=(a,b)=>({q:`${a} + ${b}`,ans:String(a+b),a,b,op:'+'});
const MI=(a,b)=>({q:`${a} − ${b}`,ans:String(a-b),a,b,op:'−'});
const TI=(a,b)=>({q:`${a} × ${b}`,ans:String(a*b),a,b,op:'×'});
const VT=x=>(x.vert=1,x);
const sw=(a,b)=>Math.random()<.5?[a,b]:[b,a];
function exprFor(w){if(w>=20&&(Math.random()<.5||w>69)){const x=RI(10,w-10);return`${x} + ${w-x}`}const y=RI(5,29);return`${w+y} − ${y}`}
const MG=[['A','🔢 口算基础（100 以内）'],['B','🧱 三位数加减'],['C','✖️ 乘法'],['D','🧩 拓展']];
const MS=[
 {id:'a1',g:'A',name:'20 以内进位加、退位减',eg:'8 + 7　15 − 9',t:3,gen(){const[a,b]=until(()=>[RI(2,9),RI(2,9)],([a,b])=>a+b>=11);return Math.random()<.5?PL(...sw(a,b)):MI(a+b,pick([a,b]))}},
 {id:'a2',g:'A',name:'整十、整百加减',eg:'30 + 50　700 − 200',t:3,gen(){const k=RI(0,3);
   if(k===0){const a=RI(1,9),b=RI(1,10-a);return PL(a*10,b*10)}
   if(k===1){const a=RI(2,10),b=RI(1,a-1);return MI(a*10,b*10)}
   if(k===2){const a=RI(1,8),b=RI(1,9-a);return Math.random()<.5?PL(a*100,b*100):MI((a+b)*100,b*100)}
   if(Math.random()<.5){const a=until(()=>RI(11,89),x=>x%10),b=10*RI(1,Math.floor((99-a)/10));return PL(a,b)}
   const a=until(()=>RI(21,99),x=>x%10),b=10*RI(1,Math.floor(a/10)-1);return MI(a,b)}},
 {id:'a3',g:'A',name:'两位数加减一位数',eg:'47 + 8　53 − 7',t:4,gen(){const c=Math.random()<.7;
   if(Math.random()<.5){const[a,b]=until(()=>[RI(11,94),RI(2,9)],([a,b])=>a+b<=100&&(a%10+b>=10)===c);return PL(a,b)}
   const[a,b]=until(()=>[RI(20,99),RI(2,9)],([a,b])=>(a%10<b)===c);return MI(a,b)}},
 {id:'a4',g:'A',name:'两位数加减（不进位、不退位）',eg:'34 + 25　78 − 43',t:6,gen(){
   if(Math.random()<.5){const[a,b]=until(()=>[RI(10,88),RI(10,88)],([a,b])=>a%10+b%10<10&&a+b<=99);return PL(a,b)}
   const[a,b]=until(()=>[RI(21,99),RI(10,89)],([a,b])=>a-b>=10&&a%10>=b%10);return MI(a,b)}},
 {id:'a5',g:'A',name:'两位数加减（进位、退位）',eg:'38 + 47　72 − 39',t:8,gen(){

/* ---------- 出题 ---------- */
// 出题：上次答错的段落换一道新题再考；其余优先出最久没见过的；同一段最多 2 道；上一轮出过的尽量不出
function rPick(n){const b=RBN[n],att=S.rd.att[n]||0,seen=S.rd.seen,lastMiss=S.rd.lastMiss[n]||[];
  const all=b.qs.map((q,i)=>({...q,id:qid(n,i),i})).filter(q=>!S.rd.bad[q.id]);
  const age=q=>seen[q.id]==null?-1:seen[q.id],least=a=>shuffle(a).sort((x,y)=>age(x)-age(y))[0];
  const ords=all.filter(q=>q.k==='order'),rest=all.filter(q=>q.k!=='order'),out=[],used=new Set(),pc={};
  const take=q=>{out.push(q);used.add(q.id);pc[q.p]=(pc[q.p]||0)+1};
  lastMiss.forEach(p=>{if(out.length>=9)return;const c=rest.filter(q=>q.p===p&&!used.has(q.id)&&age(q)!==att-1);if(c.length)take(least(c))});
  const pool=shuffle(rest.filter(q=>!used.has(q.id))).sort((x,y)=>age(x)-age(y));
  for(const q of pool){if(out.length>=9)break;if((pc[q.p]||0)<2)take(q)}
  for(const q of pool){if(out.length>=9)break;if(!used.has(q.id))take(q)}
  const po=b.parts||[];out.sort((x,y)=>po.indexOf(x.p)-po.indexOf(y.p)||x.i-y.i);
  const o=ords.length?least(ords):null;
  return[...out,...(o?[o]:[])].map(q=>q.k==='order'?{...q,cards:shuffle(q.steps.map((s,i)=>({s,i})))}:{...q,opts:shuffle([q.a,...q.x])})}
function rStart(n){stopSpeak();const qs=rPick(n),att=S.rd.att[n]||0;qs.forEach(q=>S.rd.seen[q.id]=att);S.rd.att[n]=att+1;view.rrun={n,qs,i:0,sel:null,picked:[],checked:false,log:[],stars:0,t0:Date.now(),phase:'q'};dayBonus('r');save();render()}
function renderRRun(){const R=view.rrun,b=RBN[R.n],M=$('#main');
  if(R.phase==='retell')return renderRetell();
  if(R.phase==='done')return renderRDone();
  const q=R.qs[R.i],tot=R.qs.length,okN=R.log.filter(x=>x.ok).length;
  const head=`<div class="top"><button class="x" id="rq" aria-label="退出">✕</button><div class="mbar"><i style="width:${R.i/tot*100}%"></i><b style="left:${R.i/tot*100}%">${b.e}</b></div><span class="pill ok">✓ ${okN}</span></div>
    <div class="mtitle">#${b.n} ${esc(b.t)} · Question ${R.i+1} of ${tot}${q.k==='why'?' · 🤔 Think':q.k==='vocab'?' · 📖 Word':q.k==='order'?' · 🔢 Order':''}</div>`;
  let body='';
  if(q.k==='order'){
    body=`<div class="rq">${esc(q.q)}</div><div class="small muted" style="text-align:center">Tap them in order: what happened first?</div>
      <div class="ord">${q.cards.map((c,j)=>{const p=R.picked.indexOf(j);const st=R.checked?(R.ok?'right':(q.cards[j].i===p?'right':'wrong')):'';
        return`<button class="oc ${p>=0?'on':''} ${st}" data-j="${j}"><span class="num">${p>=0?p+1:''}</span><span>${esc(c.s)}</span>${R.checked&&!R.ok?`<span class="fixn">${c.i+1}</span>`:''}</button>`}).join('')}</div>`}
  else{
    body=`<div class="rq">${esc(q.q)}</div>
      <div class="ropts">${q.opts.map((o,j)=>{let c='';if(R.checked){if(o===q.a)c='right';else if(R.sel===j)c='wrong'}else if(R.sel===j)c='on';
        return`<button class="ro ${c}" data-j="${j}">${esc(o)}</button>`}).join('')}</div>`}
  const fb=R.checked?`<div class="hint" style="margin-top:12px">${R.ok?`<b style="color:var(--ok)">✓ Correct!</b> ${esc(q.e||'')}`:`<b style="color:var(--bad)">✗ Not quite.</b> ${q.k==='order'?'The small green numbers show the right order.':esc(q.e||'')}<div class="small muted" style="margin-top:4px">📖 It's in <b>${esc(q.p)}</b>.</div>`}</div>`:'';
  const ready=q.k==='order'?R.picked.length===q.cards.length:R.sel!=null;
  M.innerHTML=`<section class="card">${head}${body}${fb}
    <div class="row" style="margin-top:14px"><button class="btn grow" id="rsay">🔊 Read to me</button>
      ${R.checked?`<button class="btn pri grow" id="rnext">${R.i<tot-1?'Next →':'Finish →'}</button>`:`<button class="btn ok grow" id="rchk" ${ready?'':'disabled'}>Check ✓</button>`}</div></section>`;
  $('#rq').onclick=rQuit;
  $('#rsay').onclick=()=>speakEn(q.q+(q.k==='order'?' '+q.cards.map(c=>c.s).join('. '):' '+q.opts.join('? ')+'?'));
  if(!R.checked){
    if(q.k==='order')$$('.oc').forEach(x=>x.onclick=()=>{const j=+x.dataset.j,p=R.picked.indexOf(j);if(p>=0)R.picked.splice(p,1);else R.picked.push(j);sfx('pop');renderRRun()});
    else $$('.ro').forEach(x=>x.onclick=()=>{R.sel=+x.dataset.j;sfx('pop');renderRRun()});
    $('#rchk').onclick=rCheck}
  else $('#rnext').onclick=()=>{R.i++;R.sel=null;R.picked=[];R.checked=false;if(R.i>=tot)R.phase='retell';stopSpeak();renderRRun()}}
function rCheck(){const R=view.rrun,q=R.qs[R.i];
  const ok=q.k==='order'?R.picked.every((j,p)=>q.cards[j].i===p):q.opts[R.sel]===q.a;
  R.checked=true;R.ok=ok;R.log.push({id:q.id,ok,k:q.k});
  if(ok){sfx('ok');addStars(1,$('#rchk'));if(S.rd.miss[q.id])S.rd.miss[q.id]=Math.max(0,S.rd.miss[q.id]-1)||undefined}
  else{sfx('no');S.rd.miss[q.id]=(S.rd.miss[q.id]||0)+1}
  save();renderRRun()}
function rQuit(){stopSpeak();const R=view.rrun;if(R&&R.log.length&&R.phase==='q'){if(!R.confirmQuit){R.confirmQuit=true;toast('再点一次 ✕ 退出（这次不算分）');return}}view.rrun=null;render()}

      <div class="mthings">${a.books.map(n=>{const[e,t]=arcItem(n);return`<div class="mt ${rPassed(n)?'on':''}"><div style="font-size:30px">${e}</div><b>${esc(t)}</b><span class="small muted">#${n}</span></div>`}).join('')}</div></div>`).join('')}
  </section>`;
  $$('.stamp[data-say]').forEach(s=>s.onclick=()=>{sfx('pop');speakEn(s.dataset.say)})}

/* ---------- 家长：Reading ---------- */
function renderRParent(){const ms=S.sessions.filter(s=>s.kind==='mth');
  const missed=Object.entries(S.rd.miss).filter(([k,v])=>v>0).sort((a,b)=>b[1]-a[1]).slice(0,12).map(([k,v])=>{const[n,i]=k.split('-').map(Number);const b=RBN[n];return b&&b.qs[i]?{n,q:b.qs[i],v}:null}).filter(Boolean);
  $('#main').innerHTML=`
  <section class="card"><h3>📚 每本书的情况</h3>
    <p class="small muted">每本书有 25 道左右的题，按情节分段。每次抽 10 题（9 道加 1 道排序），对 8 题盖章，全对是金章。答错时马上显示正确答案和解释，并告诉他在哪一段。重考时会换题：上一轮出过的尽量不出；答错的那几段，换一道新题再考。最后一步「讲给大人听」由家长判，不影响盖章。</p>
    <table><tr><th>书</th><th>最好</th><th>次数</th><th>盖章</th><th>复述</th></tr>
    ${RB.map(b=>{const r=rRes(b.n),t=S.rd.retell[b.n];return`<tr><td><b>#${b.n}</b> ${esc(b.t)}</td><td>${r.tries?r.best+'/10':'—'}</td><td>${r.tries||0}</td><td>${r.gold?'🌟 '+md(r.gold):r.pass?'🛂 '+md(r.pass):'—'}</td><td>${t?(t.ok?'👍 ':'🔁 ')+md(t.d):'—'}</td></tr>`}).join('')}</table>
  </section>
  <section class="card"><h3>🔍 常错的题</h3>
    ${missed.length?missed.map(x=>`<div style="padding:6px 0;border-bottom:1px solid var(--line)"><div class="small muted">#${x.n} · 错 ${x.v} 次</div><div>${esc(x.q.q)}</div><div class="small" style="color:var(--ok)">✓ ${esc(x.q.k==='order'?x.q.steps.join(' → '):x.q.a)}</div></div>`).join(''):'<p class="muted">还没有错题 👍</p>'}
  </section>
  <section class="card"><h3>✅ 核对题目</h3>
    <p class="small muted">题目是 Claude 根据情节写的，并对照了几个公开的情节梗概。如果哪道题不对或太难，就关掉它，之后不会再出。</p>
    ${RB.map(b=>`<details class="more"><summary>#${b.n} ${esc(b.t)}（${b.qs.length} 题）</summary>
      ${b.qs.map((q,i)=>{const id=qid(b.n,i),off=!!S.rd.bad[id];return`<div class="switch" style="align-items:flex-start;border-bottom:1px solid var(--line)"><div style="flex:1;${off?'opacity:.45':''}"><div>${i+1}. ${esc(q.q)}</div>
        <div class="small" style="color:var(--ok)">✓ ${esc(q.k==='order'?q.steps.join(' → '):q.a)}</div>${q.x?`<div class="small muted">✗ ${q.x.map(esc).join(' / ')}</div>`:''}</div>
        <button class="toggle ${off?'':'on'}" data-q="${id}" aria-label="开关"></button></div>`}).join('')}
      <div class="small" style="padding:8px 0"><b>复述题：</b>${esc(b.retell)}</div></details>`).join('')}
  </section>
  <section class="card"><h3>最近练习</h3>
    ${ms.length?`<table><tr><th>日期</th><th>书</th><th>结果</th></tr>${ms.slice(0,14).map(s=>`<tr><td>${md(s.d)}</td><td>#${s.n} ${esc((RBN[s.n]||{}).t||'')}</td><td>${s.ok}/${s.items} · ${fmt(s.secs)}${s.stars?` · +${s.stars}⭐`:''}</td></tr>`).join('')}</table>`:'<p class="muted">还没有记录。</p>'}
  </section>
  ${syncCard()}`;
  bindSync();
  $$('[data-q]').forEach(b=>b.onclick=()=>{const id=b.dataset.q;if(S.rd.bad[id])delete S.rd.bad[id];else S.rd.bad[id]=1;save();render()})}

/* ====================== 多设备同步（存在 Wendi 的 Google Drive） ====================== */
const SYNC_URL='https://script.google.com/macros/s/AKfycbwxFxHEbEV2Y_l72QCt7Imk9198Sza_zPMrmnKoCgwexwKdTVpjFJKpvebSnzMlqPD-/exec';
const SK=KEY+'.sync',BK=KEY+'.base',KID=(D.kid||'eric').toLowerCase();
let SY={};try{SY=JSON.parse(localStorage.getItem(SK)||'null')||{}}catch(e){}
const syncUrl=()=>SY.url||SYNC_URL;
const syncOn=()=>!!(syncUrl()&&SY.code&&SY.linked);
const sySave=()=>{try{localStorage.setItem(SK,JSON.stringify(SY))}catch(e){}};
const getBase=()=>{try{return JSON.parse(localStorage.getItem(BK)||'null')}catch(e){return null}};
const setBase=d=>{try{localStorage.setItem(BK,JSON.stringify(d))}catch(e){}};
const J=x=>JSON.stringify(x);
// 三方合并：b=上次同步时的版本，l=这台设备，s=云端。星星这类计数两边的增量相加，最好成绩取大，其他以这台设备为准
const COUNTERS=new Set(['stars','spent','draws','m.cleared','armSpent']),MAXK=/^(best2|best3|moleBest|m\.best|ab\.\d+\.[ABC])/;
function m3(b,l,s,path){
  if(J(l)===J(b))return s;if(J(s)===J(b))return l;
  if(typeof l==='number'&&typeof s==='number'){if(COUNTERS.has(path)||path.startsWith('cnt.'))return s+l-(typeof b==='number'?b:0);if(MAXK.test(path))return Math.max(l,s);if(/^boss\.[^.]+\.hp$/.test(path))return Math.min(l,s);return l}
  if(Array.isArray(l)&&Array.isArray(s)){const seen=new Set(s.map(J)),out=[...s];l.forEach(x=>{const k=J(x);if(!seen.has(k)){seen.add(k);out.push(x)}});
    if(path==='sessions')out.sort((x,y)=>String(y.d).localeCompare(String(x.d)));return out}
  if(l&&s&&typeof l==='object'&&typeof s==='object'&&!Array.isArray(l)&&!Array.isArray(s)){const o={},bb=b&&typeof b==='object'?b:{};
    new Set([...Object.keys(l),...Object.keys(s)]).forEach(k=>{const v=m3(bb[k],l[k],s[k],path?path+'.'+k:k);if(v!==undefined)o[k]=v});return o}
  return l}
const isBusy=()=>!!(view.run||view.game||view.mrun||view.rrun);
const fresh=()=>!S.sessions.length&&!S.stars;
function syAdopt(data,rev){S={...DEF,...data};mInit();SY.rev=rev;SY.dirty=false;setBase(data);save(true)}
const syQ=()=>{const u=syncUrl();return u+(u.includes('?')?'&':'?')+'key='+encodeURIComponent(SY.code)+'&kid='+KID+'&t='+Date.now()};
async function syFetch(body){const o={cache:'no-store',credentials:'omit',redirect:'follow'};
  const r=body?await fetch(syncUrl(),{...o,method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:J(body)}):await fetch(syQ(),o);
  if(!r.ok)throw new Error('HTTP '+r.status);const t=await r.text();try{return JSON.parse(t)}catch(e){throw new Error('回应不是数据：'+t.slice(0,40))}}
// 备用通道：有的设备/网络挡了跨域 fetch，就用 <script> 读（JSONP），写的时候用 no-cors POST 再读回来确认
function syJsonp(){return new Promise((res,rej)=>{const cb='__sy'+Date.now()+(Math.random()*1e4|0),s=document.createElement('script');let done=false;
  const end=e=>{if(done)return;done=true;clearTimeout(t);delete window[cb];s.remove();e?rej(e):0};
  window[cb]=d=>{end();res(d)};s.onerror=()=>end(new Error('备用通道也连不上'));const t=setTimeout(()=>end(new Error('备用通道超时')),20000);
  s.src=syQ()+'&callback='+cb;document.head.appendChild(s)})}
async function syReqAlt(body){if(!body)return syJsonp();
  await fetch(syncUrl(),{method:'POST',mode:'no-cors',cache:'no-store',credentials:'omit',body:J(body)});
  const s=await syJsonp();if(!s.ok)return s;
  if(s.rev===body.baseRev+1&&J(s.data)===J(body.data))return{ok:true,rev:s.rev};
  if(s.rev!==body.baseRev)return{ok:false,conflict:true,rev:s.rev,data:s.data};
  throw new Error('上传没成功')}
async function syReq(body){
  if(SY.alt)return syReqAlt(body);
  try{return await syFetch(body)}catch(e){SY.fetchErr=String(e&&e.message||e);
    const r=await syReqAlt(body);SY.alt=true;sySave();return r}}
let syT=null,syBusy=false;
function syncDirty(){if(!syncOn())return;SY.dirty=true;sySave();clearTimeout(syT);syT=setTimeout(()=>syncNow(),2500)}
async function syncNow(){if(!syncOn()||syBusy||!navigator.onLine)return;syBusy=true;let changed=false;
  try{let r=await syReq();if(!r.ok)throw new Error(r.err==='key'?'同步码不对':r.err||'云端出错');
    for(let tries=0;;tries++){
      if(r.rev!==SY.rev&&r.data){
        if(isBusy()){SY.later=true;break}
        if(!SY.dirty){syAdopt(r.data,r.rev);changed=true;break}
        const m=m3(getBase()||{},JSON.parse(J(S)),r.data,'');S={...DEF,...m};mInit();SY.rev=r.rev;save(true);changed=true}
      else if(!SY.dirty){SY.rev=r.rev;break}
      const data=JSON.parse(J(S)),p=await syReq({key:SY.code,kid:KID,baseRev:SY.rev||0,data});
      if(p.ok){SY.rev=p.rev;SY.dirty=false;setBase(data);break}
      if(p.conflict&&tries<3){r=p;continue}
      throw new Error(p.err==='key'?'同步码不对':'上传失败')}
    SY.last=Date.now();SY.err=''}
  catch(e){SY.err=(e instanceof TypeError?'暂时连不上网，联网后会自动补传':String(e&&e.message||e))+(SY.fetchErr?'（'+SY.fetchErr+'）':'')}
  finally{syBusy=false;sySave();paintSync();if(changed&&!isBusy()&&!$('#modal').innerHTML)render()}}
function paintSync(){const el=$('#syncSt');if(!el)return;
  el.innerHTML=SY.err?`<span style="color:var(--bad)">⚠️ ${esc(SY.err)}</span>`:SY.last?`✓ 上次同步 ${md(dstr(new Date(SY.last)))} ${new Date(SY.last).toTimeString().slice(0,5)}${SY.dirty?' · 有新记录等上传':''}`:'连接中…'}
async function syncLink(code){code=code.trim().toLowerCase();if(!code)return toast('请输入同步码');if(!syncUrl())return toast('云端还没设置好');
  SY.code=code;let r;try{r=await syReq()}catch(e){return toast('连不上云端：'+(e&&e.message||e)+(SY.fetchErr?' / '+SY.fetchErr:''))}
  if(!r.ok){SY.code='';return toast(r.err==='key'?'同步码不对':'云端出错')}
  const go=mode=>{$('#modal').innerHTML='';SY.linked=true;
    if(mode==='cloud')syAdopt(r.data,r.rev);
    else{SY.rev=r.data?r.rev:(r.rev||0);setBase({});SY.dirty=true;if(r.data){const m=m3({},JSON.parse(J(S)),r.data,'');S={...DEF,...m};mInit();save(true)}}
    sySave();toast('已连接，开始同步');render();syncNow()};
  if(!r.data||fresh())return go(r.data?'cloud':'mine');
  $('#modal').innerHTML=`<div class="modal"><div class="box"><div class="ic" style="font-size:56px">☁️</div><h2>云端已经有记录了</h2>
    <p class="muted small">这台设备上也有记录（⭐ ${S.stars}，${S.sessions.length} 次练习）。云端是别的设备上传的。</p>
    <button class="big-btn" id="syM">合并两边（推荐）</button><p class="small muted">星星、贴纸、徽章、错题都合在一起。</p>
    <button class="btn" style="width:100%;margin-top:6px" id="syC">只用云端的，这台的不要了</button>
    <button class="btn ghost" style="width:100%;margin-top:6px" id="syX">先不连</button></div></div>`;
  $('#syM').onclick=()=>go('mine');$('#syC').onclick=()=>go('cloud');$('#syX').onclick=()=>{SY.code='';$('#modal').innerHTML=''}}
function syncCard(){
  return`<section class="card"><h3>☁️ 多设备同步</h3>
    ${syncOn()?`<p class="small muted">这台设备已经连上，记录会自动和其他设备互通（存在妈妈的 Google Drive，每天自动另存一份备份）。</p>
      <div class="small" id="syncSt"></div>
      <div class="row" style="margin-top:8px"><button class="btn grow" id="syNow">立即同步</button><button class="btn ghost grow" id="syOff">这台设备断开</button></div>`
    :syncUrl()?`<p class="small muted">在每台设备上输一次同步码，星星、徽章、错题就会自动互通。</p>
      <div class="row"><input class="in" id="syCode" placeholder="同步码" autocapitalize="off" autocomplete="off" style="flex:1"><button class="btn pri" id="syGo">连接</button></div>`
    :`<p class="small muted">云端还没设置好。</p>`}
    <details class="more"><summary>高级</summary><input class="in" id="syUrl" placeholder="同步网址（一般不用填）" value="${esc(SY.url||'')}" style="margin-top:8px"><button class="btn" style="margin-top:6px" id="syUrlS">保存网址</button></details>
  </section>`}
function bindSync(){paintSync();
  if($('#syGo'))$('#syGo').onclick=()=>syncLink($('#syCode').value);
  if($('#syNow'))$('#syNow').onclick=async()=>{SY.err='';paintSync();await syncNow();toast(SY.err?'同步失败：'+SY.err:'同步好了')};
  if($('#syOff'))$('#syOff').onclick=()=>{SY={url:SY.url};sySave();toast('这台设备已断开，记录还在本机');render()};
  $('#syUrlS').onclick=()=>{SY.url=$('#syUrl').value.trim();SY.linked=false;sySave();render()}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')syncNow();else if(SY.dirty)syncNow()});
window.addEventListener('online',()=>syncNow());


render();
syncNow();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
